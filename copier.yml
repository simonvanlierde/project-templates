_subdirectory: template
# `stacks` is a multiselect, which needs 9.1.0.
_min_copier_version: "9.1.0"
# Written once, then owned by the project: `copier update` leaves it alone.
_skip_if_exists:
  - CHANGELOG.md

project_name:
  type: str
  help: Project name (directory / repo name)
  default: "{{ _copier_conf.dst_path.name }}"
  validator: >-
    {% if not (project_name|lower|replace(' ', '-')|regex_replace('[^a-z0-9._-]', '')|regex_search('^[a-z0-9]')) %}
    The name needs a leading ASCII letter or digit: npm, PyPI and image tags are built from it.
    {% endif %}

# Computed, not asked. npm, PyPI, compose and image tags need this normalized form.
slug:
  type: str
  when: false
  default: "{{ project_name|lower|replace(' ', '-')|regex_replace('[^a-z0-9._-]', '') }}"

project_description:
  type: str
  help: One-line description
  default: ""

github_user:
  type: str
  help: GitHub user or org
  default: simonvanlierde

author_name:
  type: str
  help: Author name, for package metadata and the license
  default: Simon van Lierde

author_email:
  type: str
  help: Author email, for package metadata
  default: simonvanlierde@gmail.com

license:
  type: str
  help: License (texts are the canonical ones from the GitHub licenses API)
  choices:
    MIT (permissive, shortest): MIT
    Apache-2.0 (permissive, explicit patent grant): Apache-2.0
    BSD-3-Clause (permissive, no endorsement clause): BSD-3-Clause
    None (not licensed for redistribution): none
  default: MIT

copyright_year:
  type: str
  when: "{{ license != 'none' }}"
  help: Copyright year
  default: "2026"

stacks:
  type: str
  multiselect: true
  help: Which stacks this repo uses
  choices: [python, ts, rust, go, docker]
  default: [python]

# `.` is a single-package repo. Any other value nests only the package. Workflows,
# hooks, justfile and answers file stay at the root.
python_dir:
  type: str
  when: "{{ 'python' in stacks }}"
  help: Directory holding the Python package (`.` for the repo root, `apps/api` for a monorepo)
  default: "."
  validator: >-
    {% if python_dir != '.' and (python_dir.startswith(('.', '/')) or python_dir.endswith('/') or '..' in python_dir) %}
    Give a plain relative path such as `apps/api`: no leading `./` or `/`, no trailing `/`, no `..`.
    {% endif %}

ts_dir:
  type: str
  when: "{{ 'ts' in stacks }}"
  help: Directory holding the TypeScript package (`.` for the repo root, `apps/web` for a monorepo)
  default: "."
  validator: >-
    {% if ts_dir != '.' and (ts_dir.startswith(('.', '/')) or ts_dir.endswith('/') or '..' in ts_dir) %}
    Give a plain relative path such as `apps/web`: no leading `./` or `/`, no trailing `/`, no `..`.
    {% endif %}

rust_dir:
  type: str
  when: "{{ 'rust' in stacks }}"
  help: Directory holding the Rust crate (`.` for the repo root, `crates/core` for a monorepo)
  default: "."
  validator: >-
    {% if rust_dir != '.' and (rust_dir.startswith(('.', '/')) or rust_dir.endswith('/') or '..' in rust_dir) %}
    Give a plain relative path such as `crates/core`: no leading `./` or `/`, no trailing `/`, no `..`.
    {% endif %}

go_dir:
  type: str
  when: "{{ 'go' in stacks }}"
  help: Directory holding the Go module (`.` for the repo root, `services/api` for a monorepo)
  default: "."
  validator: >-
    {% if go_dir != '.' and (go_dir.startswith(('.', '/')) or go_dir.endswith('/') or '..' in go_dir) %}
    Give a plain relative path such as `services/api`: no leading `./` or `/`, no trailing `/`, no `..`.
    {% endif %}

# --- python -------------------------------------------------------------------

kind:
  type: str
  when: "{{ 'python' in stacks }}"
  help: What kind of Python project
  choices:
    Library (packaged, publishable to PyPI): library
    Application (packaged, not published): app
    Research (packaged, plus notebooks/ and data/): research
    Data pipeline (packaged, plus sources.toml and fetch/build/validate): data-pipeline
    Web service (FastAPI, /health, OpenTelemetry, shipped as a container): web-service
  default: library
  validator: >-
    {% if kind == 'web-service' and 'docker' not in stacks %}
    A web service ships as a container: add docker to `stacks` too.
    {% endif %}

module_name:
  type: str
  when: "{{ 'python' in stacks }}"
  help: Importable Python module name
  default: "{{ slug|replace('-', '_')|replace('.', '_') }}"
  validator: >-
    {% if not module_name|regex_search('^[a-z_][a-z0-9_]*$') %}
    A module name is lower-case letters, digits and `_`, and cannot start with a digit.
    {% endif %}

author_orcid:
  type: str
  when: "{{ 'python' in stacks and kind in ('research', 'data-pipeline') }}"
  help: ORCID iD for CITATION.cff, as 0000-0000-0000-0000 (blank for none)
  default: "0009-0006-6953-909X"

# renovate: datasource=python-version depName=python
python_version:
  type: str
  when: "{{ 'python' in stacks }}"
  help: Python version (3.12 or later)
  default: "3.14"
  validator: >-
    {% if not python_version|regex_search('^3\\.(1[2-9]|[2-9][0-9])$') %}
    Give a version from 3.12 up, as `3.14`: the template uses `type` statements.
    {% endif %}

publish_to_pypi:
  type: bool
  when: "{{ 'python' in stacks and kind == 'library' }}"
  help: Add a release workflow publishing to PyPI via trusted publishing (needs setup on pypi.org first)
  default: false

# --- ts -----------------------------------------------------------------------

ts_kind:
  type: str
  when: "{{ 'ts' in stacks }}"
  help: What kind of TypeScript project
  choices:
    Library (publishes dist/ and type declarations): library
    Application (builds to dist/, not published): app
  default: library

# renovate: datasource=node-version depName=node
node_version:
  type: str
  when: "{{ 'ts' in stacks }}"
  help: Node.js major version
  # NOTE: Node 26 is Current; it becomes the active LTS in Oct 2026.
  default: "26"

publish_to_npm:
  type: bool
  when: "{{ 'ts' in stacks and ts_kind == 'library' }}"
  help: Add a release workflow publishing to npm via trusted publishing (needs setup on npmjs.com first)
  default: false

# --- rust ---------------------------------------------------------------------

rust_kind:
  type: str
  when: "{{ 'rust' in stacks }}"
  choices:
    Library (src/lib.rs, documented public API): library
    Binary (src/main.rs, may print): binary
  default: library
  # crate_name is computed after this question, and copier skips validators on
  # computed questions. Its check lives here instead, derived from slug the same way.
  validator: >-
    {% set ident = slug|replace('.', '-')|replace('-', '_') %}
    {% if ident|regex_search('^[0-9]') %}
    Cargo rejects a crate name that starts with a digit (`{{ ident }}`): start the project name with a letter.
    {% endif %}

# Computed, never asked. Cargo takes `-` and `_` but not the `.` a slug may carry.
crate_name:
  type: str
  when: false
  default: "{{ slug|replace('.', '-') }}"

# The crate's rust-version: its minimum supported Rust version (MSRV). Clippy
# reads it too, and skips lints that suggest newer APIs. Defaults to the current stable minor.
# renovate: datasource=github-releases depName=rust-lang/rust
rust_version:
  type: str
  when: "{{ 'rust' in stacks }}"
  help: Minimum supported Rust version (Cargo.toml rust-version)
  default: "1.98"

# --- go -----------------------------------------------------------------------

go_kind:
  type: str
  when: "{{ 'go' in stacks }}"
  choices:
    Library (a package at the module root, with an Example): library
    Binary (package main at the module root): binary
  default: library

go_module:
  type: str
  when: "{{ 'go' in stacks }}"
  help: Go module path (go.mod `module`)
  default: "github.com/{{ github_user }}/{{ slug }}"
  # go_package is computed, and copier skips validators on computed questions,
  # so its check lives here.
  validator: >-
    {% set pkg = slug|regex_replace('[^a-z0-9]', '') %}
    {% if not pkg|regex_search('^[a-z_][a-z0-9_]*$') %}
    The Go package name would be `{{ pkg }}`, which is not a valid identifier: start the project name with a letter.
    {% endif %}

# Computed, never asked. A package name is one lowercase identifier: no `-` or
# `.`, which a slug may carry.
go_package:
  type: str
  when: false
  default: "{{ slug|regex_replace('[^a-z0-9]', '') }}"

# go.mod's `go` directive: the oldest Go the module builds with, and the
# language version the linters check against. Defaults to the current stable
# minor. golangci-lint must be built with at least this Go.
# renovate: datasource=golang-version depName=go versioning=semver-coerced
go_version:
  type: str
  when: "{{ 'go' in stacks }}"
  help: Minimum Go version (go.mod `go` directive)
  default: "1.27"

# Computed, never asked: the uv the generated workflows install. Pinned because
# CI runs `uv audit`, a preview command that can change in any uv release.
# renovate: datasource=pypi depName=uv
uv_version:
  type: str
  when: false
  default: 0.12.19

# Computed, never asked: the golangci-lint release that the README, `just go-check`
# and go.yml pin, kept in one place. Renovate bumps it from its `# renovate:` line.
# renovate: datasource=github-releases depName=golangci/golangci-lint
golangci_lint_version:
  type: str
  when: false
  default: v2.14.0

# The govulncheck a new go.mod requires as a tool. Dependabot bumps it in the
# project after that.
# renovate: datasource=go depName=golang.org/x/vuln
govulncheck_version:
  type: str
  when: false
  default: v1.8.0

# --- docker -------------------------------------------------------------------

docker_stacks:
  type: str
  multiselect: true
  when: "{{ 'docker' in stacks }}"
  help: Which stacks get an image (one Dockerfile each, one compose service each)
  choices: [python, ts]
  default: [python]
  # Each image builds from its stack's package, and two Dockerfiles cannot share a
  # directory, so two images need a monorepo layout.
  validator: >-
    {% if not docker_stacks %}
    Pick at least one stack to build an image from.
    {% elif docker_stacks | reject('in', stacks) | list %}
    An image needs its stack: add {{ docker_stacks | reject('in', stacks) | join(' and ') }} to `stacks` too.
    {% elif kind == 'web-service' and 'python' not in docker_stacks %}
    The web-service kind is the python image: add python to `docker_stacks`.
    {% elif docker_stacks | length > 1 and python_dir == ts_dir %}
    Both images would be written to {{ python_dir }}/Dockerfile. Give python_dir
    and ts_dir different values first.
    {% endif %}

app_port:
  type: int
  when: "{{ 'docker' in stacks }}"
  help: Port the service listens on
  default: 8000

publish_to_ghcr:
  type: bool
  when: "{{ 'docker' in stacks }}"
  help: Push the image to GitHub Container Registry (CI builds it either way)
  default: false
