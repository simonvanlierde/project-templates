_subdirectory: template
# `ask:` hides the advanced questions behind `customise`, which needs 9.19.0.
_min_copier_version: "9.19.0"
# Each entry starts with `/`: copier matches these like .gitignore lines, so a bare
# README.md would also skip data/README.md. In a project that deleted a file the template
# renders, copier 9.19.1 renders these before it loads the answers, so ts_dir and go_dir
# fall back to '.': a package at the root then keeps its own files, where every entry used
# to miss and the update conflicted them with the template's.
_skip_if_exists:
  # Owned: written once, then the project's. `copier update` and a `copier copy` into an
  # existing repo leave one that exists alone, and re-create one that is missing, so a
  # release can add them to existing projects. The README is the project's from its first
  # real paragraph; a release adds its version, date and DOI to the citation files; the
  # community-level documents, PRODUCT.md, DESIGN.md and the legal pages are skeletons the
  # project fills in. go.mod is rewritten by the first `go mod tidy`, and the committed API
  # report by `just ts-api`.
  - /README.md
  - /.github/allowed_signers
  - /CHANGELOG.md
  - /GOVERNANCE.md
  - /docs/roadmap.md
  - /docs/assurance-case.md
  - /docs/accessibility.md
  - /CITATION.cff
  - /codemeta.json
  - /_typos.toml
  - "/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}index.html"
  - "/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}tests/e2e/routes.ts"
  - "/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}PRODUCT.md"
  - "/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}DESIGN.md"
  - "/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}docs/accessibility.md"
  - "/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}docs/accessibility-assessment.md"
  - "/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}docs/privacy.md"
  - "/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}docs/terms.md"
  - "/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}{{ slug }}.api.md"
  - "/{{ '' if go_dir | default('.') == '.' else go_dir ~ '/' }}go.mod"
  - "/{{ 'compose.yaml' if compose_only else '.no-compose-starter' }}"
  - "/{{ '.env.example' if compose_only else '.no-compose-starter' }}"
  - /docs/decisions/README.md
  - /docs/decisions/0001-start-from-project-templates.md
  - /site/astro.config.mjs
  - /site/src/layouts/Base.astro
  - /zensical.toml
  - /docs/index.md
  - /docs/reference.md
  # Samples: code and pages the project replaces. Each is also in the update-only
  # `_exclude` below, so one the project deleted stays deleted (check-render checks both).
  - "/{{ '' if python_dir == '.' else python_dir ~ '/' }}{{ 'src/' if python_layout == 'src' else '' }}{{ module_name }}/__init__.py"
  - "/{{ '' if python_dir == '.' else python_dir ~ '/' }}tests/test_add.py"
  - "/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}src/App.tsx"
  - "/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}src/App.test.tsx"
  - "/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}src/main.tsx"
  - "/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}src/app.css"
  - "/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}worker/index.ts"
  - "/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}worker/index.test.ts"
  - /docs/og-card.html
  - /site/index.html
  - /site/style.css
  - /site/main.mjs
  - /site/src/pages/index.astro
  - /site/src/pages/about.md
  - /site/worker/index.mjs
  - /site/worker/index.test.mjs

# Defaults, plus the samples from _skip_if_exists when updating.
_exclude:
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - "{% if _copier_operation == 'update' %}/{{ '' if python_dir == '.' else python_dir ~ '/' }}{{ 'src/' if python_layout == 'src' else '' }}{{ module_name }}/__init__.py{% endif %}"
  - "{% if _copier_operation == 'update' %}/{{ '' if python_dir == '.' else python_dir ~ '/' }}tests/test_add.py{% endif %}"
  - "{% if _copier_operation == 'update' %}/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}src/App.tsx{% endif %}"
  - "{% if _copier_operation == 'update' %}/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}src/App.test.tsx{% endif %}"
  - "{% if _copier_operation == 'update' %}/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}src/main.tsx{% endif %}"
  - "{% if _copier_operation == 'update' %}/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}src/app.css{% endif %}"
  - "{% if _copier_operation == 'update' %}/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}worker/index.ts{% endif %}"
  - "{% if _copier_operation == 'update' %}/{{ '' if ts_dir | default('.') == '.' else ts_dir ~ '/' }}worker/index.test.ts{% endif %}"
  - "{% if _copier_operation == 'update' %}/site/index.html{% endif %}"
  - "{% if _copier_operation == 'update' %}/site/style.css{% endif %}"
  - "{% if _copier_operation == 'update' %}/site/main.mjs{% endif %}"
  - "{% if _copier_operation == 'update' %}/site/src/pages/index.astro{% endif %}"
  - "{% if _copier_operation == 'update' %}/site/src/pages/about.md{% endif %}"
  - "{% if _copier_operation == 'update' %}/site/worker/index.mjs{% endif %}"
  - "{% if _copier_operation == 'update' %}/site/worker/index.test.mjs{% endif %}"
  - "{% if _copier_operation == 'update' %}/docs/og-card.html{% endif %}"

# Shown on `copier copy` only; `--quiet` hides both.
_message_before_copy: |
  Each question says what it changes, and most have a default. Your GitHub user, name
  and email can come from Copier's settings file instead: see "Your details" in
  https://github.com/simonvanlierde/project-templates#your-details
_message_after_copy: |
  Next, in the new project:
  {%- for stack in stacks if stack != 'docker' %}
    just {{ {'python': 'py', 'ts': 'ts', 'rust': 'rs', 'go': 'go'}[stack] }}-sync
  {%- endfor %}
  {%- if site == 'astro' %}
    just site-sync
  {%- endif %}
  {%- if web_app or site != 'none' %}
    just og-card
  {%- endif %}
    just check
  {%- if stacks | reject('equalto', 'docker') | list or site == 'astro' %}
  Then commit, lockfiles included: CI installs exactly what they list.
  {%- else %}
  Then commit.
  {%- endif %}
  After the first push, run `just repo-settings` to protect main.
  {%- for reg, on in [('PyPI', publish_to_pypi | default(false)), ('npm', publish_to_npm | default(false)), ('ghcr', publish_to_ghcr | default(false))] if on %}
  Before the first {{ reg }} release, set up the trusted publisher and the protected environment:
  https://github.com/simonvanlierde/project-templates/blob/main/docs/usage.md#publishing
  {%- endfor %}
  To release, run `just release X.Y.Z` (it cuts the CHANGELOG, then signs and pushes the tag).
  It needs an SSH signing key listed in .github/allowed_signers: that file says how to add yours.
  {%- if citable %} Set the version first in every manifest
  {{ 'citesync.toml lists' if (python_dir != '.' or ts_dir != '.' or rust_dir != '.') else 'at the root' }}, and in CITATION.cff once it has a `version`:
  citesync stops the release while they differ.
  {%- elif publish_to_pypi | default(false) or publish_to_npm | default(false) %} Set the version in the package manifest first.
  {%- endif %}
  Later, `copier update` pulls in new template releases.

# The questions run from what the user knows (name, kind, who owns it) to tooling
# detail. Everything after `customise` has `ask: "{{ customise }}"`: answered no, it
# takes its default, or keeps its stored answer on `copier update`. Never hide an
# asked question with `when: false` instead: copier then drops its stored answer on
# update and recomputes it. docs/usage.md lists the tree.

project_name:
  type: str
  help: Project name, used for the repo and directory; package, crate and image names are made from it
  default: "{{ _copier_conf.dst_path.name }}"
  validator: >-
    {% if not (project_name|lower|replace(' ', '-')|regex_replace('[^a-z0-9._-]', '')|regex_search('^[a-z0-9]')) %}
    The name needs a leading ASCII letter or digit: npm, PyPI and image tags are built from it.
    {% elif project_name|regex_search('[*~`\\[\\]<>\\\\]|(^|[^A-Za-z0-9])_|_($|[^A-Za-z0-9])') %}
    Leave out * ~ ` [ ] < > and \, and _ outside a word: the name is written into Markdown and HTML pages.
    {% endif %}

# Computed, not asked. npm, PyPI, compose and image tags need this normalized form.
slug:
  type: str
  when: false
  default: "{{ project_name|lower|replace(' ', '-')|regex_replace('[^a-z0-9._-]', '')|regex_replace('[._-]+$', '') }}"

# Computed, never asked: the slug as a Cloudflare Worker name, which takes `-` but not
# the `.` or `_` a slug may carry.
worker_slug:
  type: str
  when: false
  default: "{{ slug | replace('.', '-') | replace('_', '-') }}"

project_description:
  type: str
  help: One-line description, for the README, package metadata and citation files
  default: ""
  # It also lands unescaped in a Python docstring and in Go and TS comments.
  validator: >-
    {% if project_description.splitlines()|length > 1 or '"""' in project_description or '*/' in project_description or '\\' in project_description %}
    Keep the description to one line, without """, */ or \: it goes into docstrings and code comments.
    {% endif %}

stacks:
  type: str
  multiselect: true
  help: Languages and tools in this repo; each adds its package, CI workflow and `just` recipes
  choices: [python, ts, rust, go, docker]
  default: [python]
  validator: >-
    {% if not stacks %}
    Pick at least one stack: with none, `just check` checks nothing.
    {% endif %}

kind:
  type: str
  when: "{{ 'python' in stacks }}"
  help: What the Python package is; sets its layout, extra files and CI
  choices:
    Library (packaged, publishable to PyPI): library
    Application (packaged, not published): app
    Research (packaged, plus notebooks/ and data/): research
    Data pipeline (packaged, plus sources.toml and fetch/build/validate): data-pipeline
    Web service (FastAPI, /health, OpenTelemetry, shipped as a container): web-service
  default: library
  validator: >-
    {% if kind == 'web-service' and 'docker' not in stacks %}
    A web service ships as a container: add docker to `stacks` too.
    {% endif %}

ts_kind:
  type: str
  when: "{{ 'ts' in stacks }}"
  help: What the TypeScript package is; a Node package, or a browser app on Cloudflare Workers
  choices:
    Library (publishes dist/ and type declarations): library
    Application (builds to dist/, not published): app
    Web app (Vite single-page app, Playwright e2e, Cloudflare Workers): web-app
  default: library

# Computed, never asked: the TypeScript package is a web app.
web_app:
  type: bool
  when: false
  default: "{{ 'ts' in stacks and ts_kind == 'web-app' }}"

# Only the web-app kind renders JSX. Preact runs the same code through its
# React-compatible layer, aliased in vite.config.ts and tsconfig.json.
web_framework:
  type: str
  when: "{{ web_app }}"
  help: UI library for the web app; Preact runs the same React code in a smaller bundle
  choices:
    React: react
    Preact (React API through preact/compat, a smaller bundle): preact
  default: react

# Decides the legal pages: every web app gets docs/privacy.md, and `accounts`
# adds docs/terms.md. No default, on purpose: `--defaults` and an answers file
# from before this question stop on it ("is required") instead of claiming the
# app keeps nothing, and copier refuses any answer outside the choices. An empty
# default would not do: copier checks it against the choices even when skipped.
user_data:
  type: str
  when: "{{ web_app }}"
  help: What does the app keep about its users? Sets what the privacy page says, and whether there is a terms page
  choices:
    Nothing (no cookies, no storage, no accounts): nothing
    Only in the browser (local storage the user can clear): browser
    Accounts or uploads (kept on a server): accounts

rust_kind:
  type: str
  when: "{{ 'rust' in stacks }}"
  help: What the Rust crate is; a library gets the public-API lints and doctests
  choices:
    Library (src/lib.rs, documented public API): library
    Binary (src/main.rs, may print): binary
  default: library
  # crate_name is computed after this question, and copier skips validators on
  # computed questions. Its check lives here instead, derived from slug the same way.
  # The keywords are the Rust reference's strict and reserved ones for edition 2024.
  validator: >-
    {% set ident = slug|replace('.', '-')|replace('-', '_') %}
    {% set keywords = ['abstract', 'as', 'async', 'await', 'become', 'box', 'break', 'const', 'continue', 'crate', 'do', 'dyn', 'else', 'enum', 'extern', 'false', 'final', 'fn', 'for', 'gen', 'if', 'impl', 'in', 'let', 'loop', 'macro', 'match', 'mod', 'move', 'mut', 'override', 'priv', 'pub', 'ref', 'return', 'self', 'static', 'struct', 'super', 'trait', 'true', 'try', 'type', 'typeof', 'unsafe', 'unsized', 'use', 'virtual', 'where', 'while', 'yield'] %}
    {% if ident|regex_search('^[0-9]') %}
    Cargo rejects a crate name that starts with a digit (`{{ ident }}`): start the project name with a letter.
    {% elif ident in keywords %}
    `{{ ident }}` is a Rust keyword, so the crate (and its doctests) would not compile: pick another project name.
    {% endif %}

# Computed, never asked. Cargo takes `-` and `_` but not the `.` a slug may carry.
crate_name:
  type: str
  when: false
  default: "{{ slug|replace('.', '-') }}"

go_kind:
  type: str
  when: "{{ 'go' in stacks }}"
  help: What the Go module is; a library gets a package named after the project and an Example
  choices:
    Library (a package at the module root, with an Example): library
    Binary (package main at the module root): binary
  default: library

# Computed, never asked: some stack in this repo is a library, so it gets the extra tests.
library:
  type: bool
  when: false
  default: >-
    {{ ('python' in stacks and kind == 'library') or ('ts' in stacks and ts_kind == 'library')
    or ('rust' in stacks and rust_kind == 'library') or ('go' in stacks and go_kind == 'library') }}

# Computed, never asked. A package name is one lowercase identifier: no `-` or
# `.`, which a slug may carry.
go_package:
  type: str
  when: false
  default: "{{ slug|regex_replace('[^a-z0-9]', '') }}"

# Computed, never asked: the kinds that ship a command-line program, which get
# docs/accessibility.md. A data pipeline's `<slug> fetch|build|validate` is one; a web
# service's console script only starts the server.
cli:
  type: bool
  when: false
  default: "{{ ('rust' in stacks and rust_kind == 'binary') or ('go' in stacks and go_kind == 'binary') or ('python' in stacks and kind == 'data-pipeline') }}"

# What only outsiders need. True by default: answers files from before this
# question had SECURITY.md, and an update with the default keeps it.
public:
  type: bool
  help: Will the repo be public? Yes adds the community files in .github/ (SECURITY.md says where to report a vulnerability), CONTRIBUTING.md, CODE_OF_CONDUCT.md, issue forms, a pull request template and the dco.yml sign-off check
  default: true

github_user:
  type: str
  help: GitHub user or org that will own the repo, for its URLs and badges
  # No personal defaults: `copier copy --defaults` would publish them. Set your own
  # once under `defaults:` in copier's settings.yml (see README).
  default: ""
  validator: >-
    {% if not github_user|regex_search('^[A-Za-z0-9][A-Za-z0-9-]*$') %}
    Give the GitHub user or org that will own the repo.
    {% endif %}

author_name:
  type: str
  help: Author name, for the license and package metadata
  default: ""
  validator: >-
    {% if not author_name|trim %}
    Give an author name: the license and package metadata need one.
    {% endif %}

author_email:
  type: str
  help: Author email, for package metadata, SECURITY.md and the code of conduct. A GitHub noreply address gets no mail, so with one SECURITY.md offers only the private advisory and the code of conduct only GitHub's abuse report. A web app or command-line tool refuses one, since its privacy and accessibility pages give the address as the contact
  default: ""
  validator: >-
    {% if not author_email|regex_search('^[^@\\s]+@[^@\\s]+$') %}
    Give an email address: package metadata, SECURITY.md and the code of conduct use it.
    {% elif user_data|default('') == 'accounts' and author_email|lower == 'code@duinlab.nl' %}
    An app that keeps personal data on a server needs its own contact address, for example <app>@duinlab.nl.
    {% elif author_email|regex_search('@users\\.noreply\\.github\\.com$') and (cli or web_app) %}
    A GitHub noreply address gets no mail, and the privacy, terms and accessibility pages give it as the contact: use one that does.
    {% endif %}

customise:
  type: bool
  help: Customise advanced settings (license, directories, versions, publishing, CI extras)? No keeps the defaults in docs/usage.md
  default: false

# --- advanced -----------------------------------------------------------------

license:
  type: str
  ask: "{{ customise }}"
  help: License (texts are the canonical ones from the GitHub licenses API)
  choices:
    MIT (permissive, shortest): MIT
    Apache-2.0 (permissive, explicit patent grant): Apache-2.0
    BSD-3-Clause (permissive, no endorsement clause): BSD-3-Clause
    GPL-3.0-or-later (copyleft, changes and derived works stay GPL): GPL-3.0-or-later
    AGPL-3.0-or-later (copyleft that also covers use over a network): AGPL-3.0-or-later
    None (not licensed for redistribution): none
  # A private repo is not licensed to anyone unless its owner says so.
  default: "{{ 'MIT' if public else 'none' }}"

# Computed, never asked: the licensed kinds that get CITATION.cff, codemeta.json
# and the citesync hooks that keep them and the package manifests in step.
citable:
  type: bool
  when: false
  default: >-
    {{ license != 'none' and (('python' in stacks and kind in ('library', 'research', 'data-pipeline'))
    or ('ts' in stacks and ts_kind == 'library')
    or ('rust' in stacks and rust_kind == 'library')
    or ('go' in stacks and go_kind == 'library')) }}

author_orcid:
  type: str
  when: "{{ citable }}"
  help: ORCID iD for the citation files, as 0000-0000-0000-0000 (blank for none)
  default: ""
  validator: >-
    {% if author_orcid and not author_orcid|regex_search('^[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$') %}
    Give the bare iD, as 0000-0000-0000-0000, without the https://orcid.org/ prefix.
    {% endif %}

# REUSE.toml's copyright line needs it for every license, so it is stored once and
# does not move to the current year on each update. Of the license texts, only the
# permissive ones carry it; the GNU texts are fixed.
copyright_year:
  type: str
  when: "{{ license != 'none' }}"
  ask: "{{ customise }}"
  help: Copyright year in the license
  default: "{{ '%Y' | strftime }}"

# The files under data/ that the project makes itself. A data pipeline commits only
# data/fetches.jsonl, a fetch log, so it defaults to CC0; its outputs are gitignored
# and carry each source's terms in datapackage.json instead.
data_license:
  type: str
  when: "{{ license != 'none' and 'python' in stacks and kind in ('research', 'data-pipeline') }}"
  ask: "{{ customise }}"
  help: License for the data you make and commit under data/ (code and data are licensed apart)
  choices:
    CC-BY-4.0 (reuse with credit, the usual choice for research data): CC-BY-4.0
    CC0-1.0 (public domain, no conditions; suits metadata): CC0-1.0
    None (the code license covers data/ too): none
  default: "{{ 'none' if license == 'none' or 'python' not in stacks else {'research': 'CC-BY-4.0', 'data-pipeline': 'CC0-1.0'}.get(kind, 'none') }}"

# `.` is a single-package repo. Any other value nests only the package. Workflows,
# hooks, justfile and answers file stay at the root. includes/dir.jinja holds the
# path check all four *_dir questions share.
python_dir:
  type: str
  when: "{{ 'python' in stacks }}"
  ask: "{{ customise }}"
  help: Directory holding the Python package (`.` for the repo root, `apps/api` for a monorepo)
  default: "."
  validator: "{% from 'includes/dir.jinja' import dir_error %}{{ dir_error(python_dir, 'apps/api') }}"

ts_dir:
  type: str
  when: "{{ 'ts' in stacks }}"
  ask: "{{ customise }}"
  help: Directory holding the TypeScript package (`.` for the repo root, `apps/web` for a monorepo)
  default: "."
  validator: "{% from 'includes/dir.jinja' import dir_error %}{{ dir_error(ts_dir, 'apps/web') }}"

rust_dir:
  type: str
  when: "{{ 'rust' in stacks }}"
  ask: "{{ customise }}"
  help: Directory holding the Rust crate (`.` for the repo root, `crates/core` for a monorepo)
  default: "."
  validator: "{% from 'includes/dir.jinja' import dir_error %}{{ dir_error(rust_dir, 'crates/core') }}"

go_dir:
  type: str
  when: "{{ 'go' in stacks }}"
  ask: "{{ customise }}"
  help: Directory holding the Go module (`.` for the repo root, `services/api` for a monorepo)
  default: "."
  validator: "{% from 'includes/dir.jinja' import dir_error %}{{ dir_error(go_dir, 'services/api') }}"

# Who opens dependency-update PRs. Both get the same rules: weekly, a one-week cooldown,
# grouped actions, hooks and dev tooling, and no updates to the copier-owned FROM tags.
# Only Dependabot also groups npm security updates (docs/tooling.md#dependencies).
dependency_bot:
  type: str
  ask: "{{ customise }}"
  help: Which bot opens dependency updates
  choices:
    Dependabot (built into GitHub, nothing to install): dependabot
    Renovate (needs the Renovate GitHub App on the repo): renovate
  default: dependabot

codecov:
  type: bool
  when: "{{ 'python' in stacks or 'ts' in stacks }}"
  ask: "{{ customise }}"
  help: Upload test coverage to Codecov (needs a CODECOV_TOKEN repository secret)
  default: false

codspeed:
  type: bool
  when: "{{ 'python' in stacks or 'rust' in stacks }}"
  ask: "{{ customise }}"
  help: Benchmark pull requests on CodSpeed (needs the repository imported on codspeed.io)
  default: false

profiling:
  type: bool
  when: "{{ 'python' in stacks or 'rust' in stacks }}"
  ask: "{{ customise }}"
  help: Profiling recipes (a sampling profiler on Python; a frame-pointer build, samply and perf stat on Rust)
  default: false

# A static page beside the code (a playground, demo or report) in site/. GitHub Pages
# serves it from main, and each open, ready pull request gets a preview Worker
# (docs/usage.md#static-site).
site:
  type: str
  ask: "{{ customise }}"
  help: A static page (playground, demo or report) in site/, deployed to GitHub Pages from main, with a preview per pull request
  choices:
    None: none
    Plain (a one-tool page in HTML, CSS and plain JavaScript modules, no build step or framework): plain
    Astro (for a site with several pages from Markdown, shared layouts and components): astro
  default: none
  # site/ and _site/ belong to the site: a package there would share them with it.
  validator: >-
    {% if site != 'none' %}{% for q, d in [('python_dir', python_dir), ('ts_dir', ts_dir), ('rust_dir', rust_dir), ('go_dir', go_dir)] if d in ('site', '_site') or d.startswith(('site/', '_site/')) %}
    {{ q }} is `{{ d }}`, where the static site goes: give {{ q }} another directory, or answer site=none.
    {% endfor %}{% endif %}

# Computed, never asked: the folder `just site` builds into, which site.yml publishes
# and previews. Gitignored.
site_out:
  type: str
  when: false
  default: "{{ 'site/dist' if site == 'astro' else '_site' }}"

# Where a push to main deploys the site. Pull request previews are Workers either way.
# Pages serves it under /<repo>/; a Worker serves it from / at site_url, which can be
# a custom domain, and can run a Worker script for /api/* (docs/usage.md#static-site).
site_host:
  type: str
  when: "{{ site != 'none' }}"
  ask: "{{ customise }}"
  help: Where main deploys the site; pull request previews are Cloudflare Workers either way
  choices:
    GitHub Pages (https://<user>.github.io/<repo>/): pages
    Cloudflare Workers static assets (served from /, a custom domain and a Worker script optional): cloudflare
  default: pages

# Computed, never asked: the site's production is a Worker, not GitHub Pages.
site_on_workers:
  type: bool
  when: false
  default: "{{ site != 'none' and site_host == 'cloudflare' }}"

# A Zensical site built from the Markdown in docs/, deployed to GitHub Pages from main
# (docs/usage.md#documentation-site). A Python library with python_api also gets an API
# reference from its docstrings. One repo has one Pages site, so it rules out a `site` on Pages.
# A web app at the root is ruled out too: its legal pages live in docs/.
docs_site:
  type: bool
  ask: "{{ customise }}"
  help: A search-indexed documentation site built from docs/ with Zensical, deployed to GitHub Pages from main (an API reference too for a Python library)
  default: false
  validator: >-
    {% if docs_site and site != 'none' and not site_on_workers %}
    The docs site and the `site` page would both deploy to this repo's one GitHub Pages site: answer site_host=cloudflare or site=none, or no here.
    {% elif docs_site and web_app and ts_dir == '.' %}
    A web app at the repo root keeps its privacy and accessibility pages in docs/, and the docs site would publish a second copy: answer a ts_dir such as web, or no here.
    {% endif %}

# The practice ladder in levels.toml (docs/usage.md#levels). The OpenSSF Best Practices
# badge is for public, open-source projects, so a private or unlicensed repo is off it.
level:
  type: str
  when: "{{ public and license != 'none' }}"
  ask: "{{ customise }}"
  help: How much the repo commits to (docs/usage.md#levels); each level adds the documents its requirements ask for
  choices:
    Minimal (a public repo with few users; no badge documents): minimal
    Standard (OpenSSF passing; CONTRIBUTING.md gains a test policy and the coding standards): standard
    Community (outside contributors, OpenSSF silver; adds GOVERNANCE.md, docs/roadmap.md and docs/assurance-case.md to fill in): community
  default: "{{ 'standard' if public and license != 'none' else 'minimal' }}"

# Computed, never asked: the community level adds the governance documents and the DCO check.
silver:
  type: bool
  when: false
  default: "{{ public and license != 'none' and level == 'community' }}"

# After `level`, which sets its default: the cold-install requirement starts at standard.
cold_install:
  type: bool
  ask: "{{ customise }}"
  help: Verify README setup instructions in a fresh Debian container on setup changes
  default: "{{ public and license != 'none' and level != 'minimal' }}"

# --- python -------------------------------------------------------------------

module_name:
  type: str
  when: "{{ 'python' in stacks }}"
  ask: "{{ customise }}"
  help: Importable Python module name
  default: "{{ slug|replace('-', '_')|replace('.', '_') }}"
  validator: >-
    {% set keywords = ['and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue', 'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield'] %}
    {% if not module_name|regex_search('^[a-z_][a-z0-9_]*$') %}
    A module name is lower-case letters, digits and `_`, and cannot start with a digit.
    Answer yes to `customise` to give one when the project name does not make one.
    {% elif module_name in keywords %}
    `{{ module_name }}` is a Python keyword, so the package could not be imported: pick another module name.
    {% endif %}

# `flat` is for adopting the template in a repo whose package already sits at the
# root: no src/ stub, and no starter tests that import it. web-service,
# data-pipeline and the python image need the starter modules, so they stay `src`.
# docker_image is asked later, so its validator refuses flat with the python image.
python_layout:
  type: str
  when: "{{ 'python' in stacks }}"
  ask: "{{ customise }}"
  help: Where the package lives; flat keeps an existing package at the root and adds no stub
  choices:
    src/<module> (a new package): src
    <module>/ at the root (an existing package): flat
  default: src
  validator: >-
    {% if python_layout == 'flat' and kind in ('web-service', 'data-pipeline') %}
    The flat layout is for an existing library, app or research package: the web-service
    and data-pipeline kinds and the python image need their starter modules in src/.
    {% endif %}

# The default trails a new Python release by 90 days (renovate.json5), so the
# packages scaffolds install have wheels for it.
# renovate: datasource=python-version depName=python
python_version:
  type: str
  when: "{{ 'python' in stacks }}"
  ask: "{{ customise }}"
  help: Python version (3.12 or later)
  default: "3.14"
  validator: >-
    {% if not python_version|regex_search('^3\\.(1[2-9]|[2-9][0-9])$') %}
    Give a version from 3.12 up, as `3.14`: the template uses `type` statements.
    {% endif %}

# A library's requires-python floor and the oldest version its CI tests. SPEC 0
# supports a Python release for three years, about three minors, so the default is
# two minors below python_version, and never below the template's own 3.12.
python_min:
  type: str
  when: "{{ 'python' in stacks and kind == 'library' }}"
  ask: "{{ customise }}"
  help: Oldest Python the library supports (requires-python, tested in CI)
  default: "3.{{ [python_version.split('.')[1] | int - 2, 12] | max }}"
  validator: >-
    {% if not python_min|regex_search('^3\\.(1[2-9]|[2-9][0-9])$') %}
    Give a version from 3.12 up, as `3.13`: the template uses `type` statements.
    {% elif python_min.split('.')[1]|int > python_version.split('.')[1]|int %}
    The oldest supported version can't be newer than python_version ({{ python_version }}).
    {% endif %}

publish_to_pypi:
  type: bool
  when: "{{ 'python' in stacks and kind == 'library' }}"
  ask: "{{ customise }}"
  help: Add a release workflow publishing to PyPI via trusted publishing (needs setup on pypi.org first)
  default: false

python_api:
  type: bool
  when: "{{ 'python' in stacks and kind == 'library' }}"
  ask: "{{ customise }}"
  help: >-
    Is the package used through its Python API, not only its command line?
    Turns on the griffe API-break check in python.yml (with publish_to_pypi)
  default: true

python_windows:
  type: bool
  when: "{{ 'python' in stacks }}"
  ask: "{{ customise }}"
  help: >-
    Run the tests on Windows too, on python_version only, to catch a missing encoding="utf-8",
    a hardcoded / in a path and other Windows-only failures. Costs one extra CI job per push
    and pull request
  default: false

# Computed, never asked: whether the docs site gets docs/reference.md, an API reference
# that mkdocstrings reads from the docstrings. A command-line-only library gets none.
docs_api:
  type: bool
  when: false
  default: "{{ docs_site and 'python' in stacks and kind == 'library' and python_api }}"

# --- ts -----------------------------------------------------------------------

# The address of whatever production deploys to a Worker: the web app, or else the
# site with site_host=cloudflare. The legal pages name it. A host other than
# *.workers.dev becomes the Worker's custom domain on each production deploy. The
# default is the workers.dev address of the Worker its wrangler config names, assuming
# the account's workers.dev subdomain is the GitHub user.
site_url:
  type: str
  when: "{{ web_app or site_on_workers }}"
  ask: "{{ customise }}"
  help: >-
    The public address of the {{ 'web app' if web_app else 'site' }}: a custom domain
    (production attaches it to the Worker), or your own workers.dev subdomain if it is not the GitHub user.
  default: "https://{{ worker_slug }}{{ '' if web_app else '-site' }}.{{ github_user | lower }}.workers.dev"
  validator: >-
    {% if not site_url|regex_search('^https://') %}
    Give the full address, starting with https://.
    {% elif not site_url|regex_search('^https://[a-z0-9.-]+/?$') %}
    Give the host alone, such as https://example.org: a Worker serves a whole host, so no path, port or capitals.
    {% endif %}

# Computed, never asked: site_url's host when it is a custom domain, else empty. The
# production deploy passes it to wrangler as --domain; previews never get it.
custom_domain:
  type: str
  when: false
  default: "{% set h = site_url | regex_replace('^https://', '') | regex_replace('/$', '') %}{{ '' if h.endswith('.workers.dev') else h }}"

# Computed, never asked: the custom domain of the site's Worker. In a repo with a web
# app, site_url is the app's, and the site keeps its workers.dev address.
site_domain:
  type: str
  when: false
  default: "{{ custom_domain if site_on_workers and not web_app else '' }}"

# Computed, never asked: where the static site is served, with a trailing slash. The social
# card's image URL starts here, as do the site's own og:image tags.
site_address:
  type: str
  when: false
  default: "{% if site == 'none' %}{% elif site_on_workers %}{{ (site_url if not web_app else 'https://' ~ worker_slug ~ '-site.' ~ github_user | lower ~ '.workers.dev') | regex_replace('/$', '') }}/{% else %}https://{{ github_user | lower }}.github.io/{{ slug }}/{% endif %}"

# Computed, never asked: the address the social card prints. The web app's, else the site's.
card_address:
  type: str
  when: false
  default: "{{ (site_url | regex_replace('/$', '') ~ '/') if web_app else site_address }}"

# Computed, never asked: the Playwright a static site runs with `pnpm dlx` to render its
# social card. A web app uses the one in its own devDependencies.
# renovate: datasource=npm depName=playwright
playwright_version:
  type: str
  when: false
  default: 1.64.1

# A Worker script in front of the static assets, for server code. Requests for files
# stay free; each request the script handles counts against the Workers plan.
worker:
  type: bool
  when: "{{ web_app or site_on_workers }}"
  ask: "{{ customise }}"
  help: Add a Worker script in front of the static assets that handles /api/* (one example route, /api/health)
  default: false

# Computed, never asked: the date the legal pages start from. They are the
# project's files from then on (_skip_if_exists), so an update never rewrites it.
legal_date:
  type: str
  when: false
  # Not %-d, which strftime on Windows rejects.
  default: "{{ '%d %B %Y' | strftime | regex_replace('^0', '') }}"

# renovate: datasource=node-version depName=node
node_version:
  type: str
  when: "{{ 'ts' in stacks }}"
  ask: "{{ customise }}"
  help: Node.js major version
  default: "26"

publish_to_npm:
  type: bool
  when: "{{ 'ts' in stacks and ts_kind == 'library' }}"
  ask: "{{ customise }}"
  help: Add a release workflow publishing to npm via trusted publishing (needs setup on npmjs.com first)
  default: false

# --- rust ---------------------------------------------------------------------

# The crate's rust-version: its minimum supported Rust version (MSRV). Clippy
# reads it too, and skips lints that suggest newer APIs. Defaults to the current stable minor.
# renovate: datasource=github-releases depName=rust-lang/rust
rust_version:
  type: str
  when: "{{ 'rust' in stacks }}"
  ask: "{{ customise }}"
  help: Minimum supported Rust version (Cargo.toml rust-version)
  default: "1.99.1"
  validator: >-
    {% if not rust_version|regex_search('^1\\.(8[5-9]|9[0-9]|[1-9][0-9]{2,})(\\.[0-9]+)?$') %}
    Give 1.85 or later, as `1.85` or `1.85.0`: Cargo.toml uses edition 2024.
    {% endif %}

# --- go -----------------------------------------------------------------------

go_module:
  type: str
  when: "{{ 'go' in stacks }}"
  ask: "{{ customise }}"
  help: Go module path (go.mod `module`)
  default: "github.com/{{ github_user }}/{{ slug }}"
  # go_package is computed, and copier skips validators on computed questions,
  # so its check lives here. A binary is package main and never uses it.
  validator: >-
    {% set pkg = slug|regex_replace('[^a-z0-9]', '') %}
    {% set keywords = ['break', 'case', 'chan', 'const', 'continue', 'default', 'defer', 'else', 'fallthrough', 'for', 'func', 'go', 'goto', 'if', 'import', 'interface', 'main', 'map', 'package', 'range', 'return', 'select', 'struct', 'switch', 'type', 'var'] %}
    {% if go_kind == 'binary' %}
    {% elif not pkg|regex_search('^[a-z_][a-z0-9_]*$') %}
    The Go package name would be `{{ pkg }}`, which is not a valid identifier: start the project name with a letter.
    {% elif pkg in keywords %}
    A library named `{{ pkg }}` can't be a Go package: it is a Go keyword or `main`. Pick another project name.
    {% endif %}

# go.mod's `go` directive: the oldest Go the module builds with, and the
# language version the linters check against. Defaults to the current stable
# minor. golangci-lint must be built with at least this Go.
# renovate: datasource=golang-version depName=go versioning=semver-coerced
go_version:
  type: str
  when: "{{ 'go' in stacks }}"
  ask: "{{ customise }}"
  help: Minimum Go version (go.mod `go` directive)
  default: "1.27"

# Computed, never asked: the committed the pr-title workflow runs. The commit-msg hook
# pins its own rev in .pre-commit-config.yaml, which the dependency bot moves.
# renovate: datasource=pypi depName=committed
committed_version:
  type: str
  when: false
  default: 1.1.11

# Computed, never asked: the uv the generated workflows install. Pinned because
# CI runs `uv audit`, a preview command that can change in any uv release.
# renovate: datasource=pypi depName=uv
uv_version:
  type: str
  when: false
  default: 0.13.6

# Computed, never asked: the griffe that python.yml's api job runs with uvx when
# publish_to_pypi and python_api are on. It compares the public API with the last git tag.
# renovate: datasource=pypi depName=griffe
griffe_version:
  type: str
  when: false
  default: 2.4.1

# Computed, never asked: the Zensical that `just docs` and docs.yml run with uvx, and
# the mkdocstrings-python it runs with for a Python library's API reference.
# renovate: datasource=pypi depName=zensical
zensical_version:
  type: str
  when: false
  default: 0.0.73

# renovate: datasource=pypi depName=mkdocstrings-python
mkdocstrings_python_version:
  type: str
  when: false
  default: 2.0.10

# Computed, never asked: the golangci-lint release that the README and go.yml pin,
# kept in one place. `just go-check` runs whichever golangci-lint is on PATH. Renovate bumps it from its `# renovate:` line.
# renovate: datasource=github-releases depName=golangci/golangci-lint
golangci_lint_version:
  type: str
  when: false
  default: v2.15.0

# Computed, never asked: the prek the README installs. Keep it equal to PREK_VERSION in
# checks.yml and advisories.yml and to package.json's @j178/prek (scripts/check-render.sh asserts that). Renovate bumps it from its `# renovate:` line.
# renovate: datasource=github-releases depName=j178/prek
prek_version:
  type: str
  when: false
  default: 0.5.7

# The govulncheck a new go.mod requires as a tool. Dependabot bumps it in the
# project after that.
# renovate: datasource=go depName=golang.org/x/vuln
govulncheck_version:
  type: str
  when: false
  default: v1.9.0

# Computed, never asked: the license checkers CI and the check recipes run. licensecheck
# judges each Python package that ships against the license in pyproject.toml, with its
# own compatibility table. go-licenses, run with `go run` outside go.mod, and the
# TypeScript check take the allow-list in includes/dependency-licenses.jinja, as
# deny.toml does for Rust.
# renovate: datasource=pypi depName=licensecheck
licensecheck_version:
  type: str
  when: false
  default: 2026.0.8

# renovate: datasource=go depName=github.com/google/go-licenses/v2
go_licenses_version:
  type: str
  when: false
  default: v2.0.1

# --- test extras --------------------------------------------------------------

# Library kinds only: their public API has to hold for any caller's input. Property
# tests run with the rest of the tests. Mutation testing takes minutes to hours and
# its score is noisy, so it runs weekly in CI (never on a pull request) and as a recipe by hand.
test_extras:
  type: str
  multiselect: true
  when: "{{ library }}"
  ask: "{{ customise }}"
  help: Extra tests for the library code (none, one or both)
  choices:
    Property tests (generated inputs checked against a rule, run with the tests and at length in a weekly CI run): property
    Mutation testing (a `just <stack>-mutation` recipe and a weekly CI run that check the tests catch planted bugs): mutation
  default: []

# Computed, never asked: the versions a new project starts on. Dependabot bumps
# them in the project after that.
# renovate: datasource=crate depName=proptest
proptest_version:
  type: str
  when: false
  default: 1.12.0

# renovate: datasource=crate depName=codspeed-divan-compat
divan_version:
  type: str
  when: false
  default: 6.0.0

# Computed, never asked: the gremlins that `just go-mutation` runs with `go run`.
# Not a go.mod tool, which would pull its ~34 modules into the project's module
# graph. `copier update` bumps it; Renovate bumps it here.
# renovate: datasource=go depName=github.com/go-gremlins/gremlins
gremlins_version:
  type: str
  when: false
  default: v0.6.0

# Computed, never asked: the tools mutation.yml, property.yml and cold-install.yml
# install. `copier update` bumps them; Renovate bumps them here.
# renovate: datasource=github-releases depName=casey/just
just_version:
  type: str
  when: false
  default: 1.59.0

# renovate: datasource=crate depName=cargo-mutants
cargo_mutants_version:
  type: str
  when: false
  default: 27.1.0

# Computed, never asked: the cargo-semver-checks that rust.yml's api job installs for a
# Rust library. It compares the public API with the last git tag.
# renovate: datasource=crate depName=cargo-semver-checks
cargo_semver_checks_version:
  type: str
  when: false
  default: 0.51.0

# Computed workflow tools follow template updates; Dependabot cannot read uvx pins.
# renovate: datasource=pypi depName=copier
copier_version:
  type: str
  when: false
  default: 9.19.1

# Computed, never asked: the wrangler a web app pins as an exact devDependency, which its
# production and preview jobs run, and the one site.yml's preview job runs with `pnpm dlx`.
# Renovate bumps it here. A web app's own dependency bot bumps its package.json; site.yml
# gets the bump through `copier update`.
# renovate: datasource=npm depName=wrangler
wrangler_version:
  type: str
  when: false
  default: 4.154.0

# Computed, never asked: the astro an Astro site pins exactly in site/package.json.
# Renovate bumps it here; a project gets the bump through `copier update`, and its own
# dependency bot bumps it after that.
# renovate: datasource=npm depName=astro
astro_version:
  type: str
  when: false
  default: 7.4.2

# Computed, never asked: the pnpm that site.yml runs wrangler with when the repo has no
# package.json, and that an Astro site's package.json names. Keep it equal to
# packageManager in package.json.jinja (check-render asserts that).
# renovate: datasource=npm depName=pnpm
pnpm_version:
  type: str
  when: false
  default: 12.16.1

# A GitHub commit, not PyPI: PyPI stops at 0.14.2, which misses the www.bestpractices.dev
# badge URL (fair-software/howfairis#383). A commit, not the tag, because a tag can be
# moved. Renovate updates the commit and the tag in the comment together.
# renovate: datasource=github-tags depName=fair-software/howfairis
howfairis_version:
  type: str
  when: false
  default: 09f3bea4f13c80f52c59c326b5dd9f93354b40a2 # 0.15.0

# --- docker -------------------------------------------------------------------

# Asked even without `customise`: without an image the render is a Compose-only repo.
# Its validator reads python_layout and kind, so it stays after them.
docker_image:
  type: bool
  when: "{{ 'docker' in stacks and 'python' in stacks }}"
  help: Build the Python package into an image (a Dockerfile and its compose service); no for a repo that only composes upstream images
  # Read even when not asked: docker without python is a Compose-only repo. Templates
  # test `'docker' in stacks and docker_image`.
  default: "{{ 'python' in stacks }}"
  validator: >-
    {% if docker_image and python_layout == 'flat' %}
    The flat layout is for an existing library, app or research package: the web-service
    and data-pipeline kinds and the python image need their starter modules in src/, or answer no to `docker_image`.
    {% elif kind == 'web-service' and not docker_image %}
    The web-service kind is shipped as the python image: answer yes to `docker_image`.
    {% endif %}

# Computed, not asked: docker without an image is a repo that only composes upstream images.
compose_only:
  type: bool
  when: false
  default: "{{ 'docker' in stacks and not docker_image }}"

# Computed, not asked: some workflow calls report-failure.yml (mutation, property,
# copier-update, preview-retire, advisories). It names that file, whose path must stay
# short enough for a Windows checkout of this repo.
reports_failures:
  type: bool
  when: false
  default: "{{ 'mutation' in test_extras or 'property' in test_extras or dependency_bot == 'dependabot' or web_app or site != 'none' or 'python' in stacks or 'ts' in stacks or 'rust' in stacks or 'go' in stacks }}"

# Computed, not asked: a ts stack or the Astro site installs Node packages with pnpm.
has_pnpm:
  type: bool
  when: false
  default: "{{ 'ts' in stacks or site == 'astro' }}"

app_port:
  type: int
  when: "{{ 'docker' in stacks and docker_image }}"
  ask: "{{ customise }}"
  help: Port the service listens on
  default: 8000
  validator: >-
    {% if app_port < 1 or app_port > 65535 %}
    Give a port from 1 to 65535.
    {% endif %}

publish_to_ghcr:
  type: bool
  when: "{{ 'docker' in stacks and docker_image }}"
  ask: "{{ customise }}"
  help: Push the image to GitHub Container Registry (CI builds it either way)
  default: false

# --- docs ---------------------------------------------------------------------

# docs/decisions/0004: a log only where choices are costly to reverse, and never an empty folder.
decision_records:
  type: bool
  ask: "{{ customise }}"
  help: Keep architecture decision records in docs/decisions/ (MADR 4.0.0), starting with one that records this template's answers
  default: "{{ kind in ['web-service', 'data-pipeline'] or ts_kind == 'web-app' or compose_only or silver }}"
