_subdirectory: template
# `ask:` hides the advanced questions behind `customise`, which needs 9.19.0.
_min_copier_version: "9.19.0"
# Written once, then owned by the project: `copier update` leaves them alone, and
# `copier copy` into an existing repo keeps its own. The README is the project's
# from its first real paragraph, so template changes to it never arrive. A release
# adds its version, date and DOI to the citation files, and an update would then
# conflict with that edit every time. The web-app entries are its starter files and
# legal pages, which the project rewrites from day one. go.mod is rewritten by the
# first `go mod tidy`, and Dependabot bumps its requirements after that; its module
# path and go version are answers fixed at copy time. The decisions index gains a
# line with each record the project writes. Each entry starts with `/`:
# copier matches these like .gitignore lines, so a bare README.md would also skip
# data/README.md.
_skip_if_exists:
  - /README.md
  - /CHANGELOG.md
  - /docs/decisions/README.md
  - /CITATION.cff
  - /.zenodo.json
  - /codemeta.json
  - "/{{ '' if ts_dir == '.' else ts_dir ~ '/' }}src/App.tsx"
  - "/{{ '' if ts_dir == '.' else ts_dir ~ '/' }}src/App.test.tsx"
  - "/{{ '' if ts_dir == '.' else ts_dir ~ '/' }}src/main.tsx"
  - "/{{ '' if ts_dir == '.' else ts_dir ~ '/' }}src/app.css"
  - "/{{ '' if ts_dir == '.' else ts_dir ~ '/' }}index.html"
  - "/{{ '' if ts_dir == '.' else ts_dir ~ '/' }}tests/e2e/routes.ts"
  - "/{{ '' if ts_dir == '.' else ts_dir ~ '/' }}docs/accessibility.md"
  - "/{{ '' if ts_dir == '.' else ts_dir ~ '/' }}docs/privacy.md"
  - "/{{ '' if ts_dir == '.' else ts_dir ~ '/' }}docs/terms.md"
  - "/{{ '' if go_dir == '.' else go_dir ~ '/' }}go.mod"
  # The committed API report: `just ts-api` rewrites it after a deliberate change.
  - "/{{ '' if ts_dir == '.' else ts_dir ~ '/' }}{{ slug }}.api.md"

# Shown on `copier copy` only; `--quiet` hides both.
_message_before_copy: |
  Each question says what it changes, and most have a default. Your GitHub user, name
  and email can come from Copier's settings file instead: see "Your details" in
  https://github.com/simonvanlierde/project-templates#your-details
_message_after_copy: |
  Next, in the new project:
  {%- for stack in stacks if stack != 'docker' %}
    just {{ {'python': 'py', 'ts': 'ts', 'rust': 'rs', 'go': 'go'}[stack] }}-sync
  {%- endfor %}
    just check
  Then commit, lockfiles included: CI installs exactly what they list.
  After the first push, run `just repo-settings` to protect main.

# The questions run from what the user knows (name, kind, who owns it) to tooling
# detail. Everything after `customise` has `ask: "{{ customise }}"`: answered no, it
# takes its default, or keeps its stored answer on `copier update`. Never hide an
# asked question with `when: false` instead: copier then drops its stored answer on
# update and recomputes it. docs/usage.md lists the tree.

project_name:
  type: str
  help: Project name, used for the repo and directory; package, crate and image names are made from it
  default: "{{ _copier_conf.dst_path.name }}"
  validator: >-
    {% if not (project_name|lower|replace(' ', '-')|regex_replace('[^a-z0-9._-]', '')|regex_search('^[a-z0-9]')) %}
    The name needs a leading ASCII letter or digit: npm, PyPI and image tags are built from it.
    {% elif project_name|regex_search('[*`\\[\\]<>\\\\]') %}
    Leave out * ` [ ] < > and \: the name is written into Markdown and HTML pages.
    {% endif %}

# Computed, not asked. npm, PyPI, compose and image tags need this normalized form.
slug:
  type: str
  when: false
  default: "{{ project_name|lower|replace(' ', '-')|regex_replace('[^a-z0-9._-]', '') }}"

project_description:
  type: str
  help: One-line description, for the README, package metadata and citation files
  default: ""

stacks:
  type: str
  multiselect: true
  help: Languages and tools in this repo; each adds its package, CI workflow and `just` recipes
  choices: [python, ts, rust, go, docker]
  default: [python]
  validator: >-
    {% if not stacks %}
    Pick at least one stack: with none, `just check` checks nothing.
    {% endif %}

kind:
  type: str
  when: "{{ 'python' in stacks }}"
  help: What the Python package is; sets its layout, extra files and CI
  choices:
    Library (packaged, publishable to PyPI): library
    Application (packaged, not published): app
    Research (packaged, plus notebooks/ and data/): research
    Data pipeline (packaged, plus sources.toml and fetch/build/validate): data-pipeline
    Web service (FastAPI, /health, OpenTelemetry, shipped as a container): web-service
  default: library
  validator: >-
    {% if kind == 'web-service' and 'docker' not in stacks %}
    A web service ships as a container: add docker to `stacks` too.
    {% endif %}

ts_kind:
  type: str
  when: "{{ 'ts' in stacks }}"
  help: What the TypeScript package is; a Node package, or a browser app on Cloudflare Pages
  choices:
    Library (publishes dist/ and type declarations): library
    Application (builds to dist/, not published): app
    Web app (Vite single-page app, Playwright e2e, Cloudflare Pages): web-app
  default: library

# Only the web-app kind renders JSX. Preact runs the same code through its
# React-compatible layer, aliased in vite.config.ts and tsconfig.json.
web_framework:
  type: str
  when: "{{ 'ts' in stacks and ts_kind == 'web-app' }}"
  help: UI library for the web app; Preact runs the same React code in a smaller bundle
  choices:
    React: react
    Preact (React API through preact/compat, a smaller bundle): preact
  default: react

# Decides the legal pages: every web app gets docs/privacy.md, and `accounts`
# adds docs/terms.md. No default, on purpose: `--defaults` and an answers file
# from before this question stop on it ("is required") instead of claiming the
# app keeps nothing, and copier refuses any answer outside the choices. An empty
# default would not do: copier checks it against the choices even when skipped.
user_data:
  type: str
  when: "{{ 'ts' in stacks and ts_kind == 'web-app' }}"
  help: What does the app keep about its users? Sets what the privacy page says, and whether there is a terms page
  choices:
    Nothing (no cookies, no storage, no accounts): nothing
    Only in the browser (local storage the user can clear): browser
    Accounts or uploads (kept on a server): accounts

rust_kind:
  type: str
  when: "{{ 'rust' in stacks }}"
  help: What the Rust crate is; a library gets the public-API lints and doctests
  choices:
    Library (src/lib.rs, documented public API): library
    Binary (src/main.rs, may print): binary
  default: library
  # crate_name is computed after this question, and copier skips validators on
  # computed questions. Its check lives here instead, derived from slug the same way.
  # The keywords are the Rust reference's strict and reserved ones for edition 2024.
  validator: >-
    {% set ident = slug|replace('.', '-')|replace('-', '_') %}
    {% set keywords = ['abstract', 'as', 'async', 'await', 'become', 'box', 'break', 'const', 'continue', 'crate', 'do', 'dyn', 'else', 'enum', 'extern', 'false', 'final', 'fn', 'for', 'gen', 'if', 'impl', 'in', 'let', 'loop', 'macro', 'match', 'mod', 'move', 'mut', 'override', 'priv', 'pub', 'ref', 'return', 'self', 'static', 'struct', 'super', 'trait', 'true', 'try', 'type', 'typeof', 'unsafe', 'unsized', 'use', 'virtual', 'where', 'while', 'yield'] %}
    {% if ident|regex_search('^[0-9]') %}
    Cargo rejects a crate name that starts with a digit (`{{ ident }}`): start the project name with a letter.
    {% elif ident in keywords %}
    `{{ ident }}` is a Rust keyword, so the crate (and its doctests) would not compile: pick another project name.
    {% endif %}

# Computed, never asked. Cargo takes `-` and `_` but not the `.` a slug may carry.
crate_name:
  type: str
  when: false
  default: "{{ slug|replace('.', '-') }}"

go_kind:
  type: str
  when: "{{ 'go' in stacks }}"
  help: What the Go module is; a library gets a package named after the project and an Example
  choices:
    Library (a package at the module root, with an Example): library
    Binary (package main at the module root): binary
  default: library

# Computed, never asked. A package name is one lowercase identifier: no `-` or
# `.`, which a slug may carry.
go_package:
  type: str
  when: false
  default: "{{ slug|regex_replace('[^a-z0-9]', '') }}"

# Computed, never asked: the kinds that get CITATION.cff, .zenodo.json, codemeta.json
# and the hook that checks CITATION.cff.
citable:
  type: bool
  when: false
  default: "{{ 'python' in stacks and kind in ('library', 'research', 'data-pipeline') }}"

# What only outsiders need. True by default: answers files from before this
# question had SECURITY.md, and an update with the default keeps it.
public:
  type: bool
  help: Will the repo be public? Yes adds the community files in .github/ (SECURITY.md says where to report a vulnerability), CONTRIBUTING.md, CODE_OF_CONDUCT.md, a pull request template and the dco.yml sign-off check
  default: true

github_user:
  type: str
  help: GitHub user or org that will own the repo, for its URLs and badges
  # No personal defaults: `copier copy --defaults` would publish them. Set your own
  # once under `defaults:` in copier's settings.yml (see README).
  default: ""
  validator: >-
    {% if not github_user|regex_search('^[A-Za-z0-9][A-Za-z0-9-]*$') %}
    Give the GitHub user or org that will own the repo.
    {% endif %}

author_name:
  type: str
  help: Author name, for the license and package metadata
  default: ""
  validator: >-
    {% if not author_name|trim %}
    Give an author name: the license and package metadata need one.
    {% endif %}

author_email:
  type: str
  help: Author email, for package metadata, SECURITY.md and the code of conduct
  default: ""
  validator: >-
    {% if not author_email|regex_search('^[^@\\s]+@[^@\\s]+$') %}
    Give an email address: package metadata, SECURITY.md and the code of conduct use it.
    {% endif %}

author_orcid:
  type: str
  when: "{{ citable }}"
  help: ORCID iD for the citation files, as 0000-0000-0000-0000 (blank for none)
  default: ""
  validator: >-
    {% if author_orcid and not author_orcid|regex_search('^[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$') %}
    Give the bare iD, as 0000-0000-0000-0000, without the https://orcid.org/ prefix.
    {% endif %}

customise:
  type: bool
  help: Customise advanced settings (license, directories, versions, publishing, CI extras)? No keeps the defaults in docs/usage.md
  default: false

# --- advanced -----------------------------------------------------------------

license:
  type: str
  ask: "{{ customise }}"
  help: License (texts are the canonical ones from the GitHub licenses API)
  choices:
    MIT (permissive, shortest): MIT
    Apache-2.0 (permissive, explicit patent grant): Apache-2.0
    BSD-3-Clause (permissive, no endorsement clause): BSD-3-Clause
    GPL-3.0-or-later (copyleft, changes and derived works stay GPL): GPL-3.0-or-later
    LGPL-3.0-or-later (weak copyleft, may be linked from code under other licenses): LGPL-3.0-or-later
    AGPL-3.0-or-later (copyleft that also covers use over a network): AGPL-3.0-or-later
    None (not licensed for redistribution): none
  # A private repo is not licensed to anyone unless its owner says so.
  default: "{{ 'MIT' if public else 'none' }}"

# Only the permissive texts carry a copyright line. The GNU texts are fixed, and
# their copyright notice goes in each source file instead.
copyright_year:
  type: str
  when: "{{ license in ('MIT', 'Apache-2.0', 'BSD-3-Clause') }}"
  ask: "{{ customise }}"
  help: Copyright year in the license
  default: "{{ '%Y' | strftime }}"

# `.` is a single-package repo. Any other value nests only the package. Workflows,
# hooks, justfile and answers file stay at the root. includes/dir.jinja holds the
# path check all four *_dir questions share.
python_dir:
  type: str
  when: "{{ 'python' in stacks }}"
  ask: "{{ customise }}"
  help: Directory holding the Python package (`.` for the repo root, `apps/api` for a monorepo)
  default: "."
  validator: "{% from 'includes/dir.jinja' import dir_error %}{{ dir_error(python_dir, 'apps/api') }}"

ts_dir:
  type: str
  when: "{{ 'ts' in stacks }}"
  ask: "{{ customise }}"
  help: Directory holding the TypeScript package (`.` for the repo root, `apps/web` for a monorepo)
  default: "."
  validator: "{% from 'includes/dir.jinja' import dir_error %}{{ dir_error(ts_dir, 'apps/web') }}"

rust_dir:
  type: str
  when: "{{ 'rust' in stacks }}"
  ask: "{{ customise }}"
  help: Directory holding the Rust crate (`.` for the repo root, `crates/core` for a monorepo)
  default: "."
  validator: "{% from 'includes/dir.jinja' import dir_error %}{{ dir_error(rust_dir, 'crates/core') }}"

go_dir:
  type: str
  when: "{{ 'go' in stacks }}"
  ask: "{{ customise }}"
  help: Directory holding the Go module (`.` for the repo root, `services/api` for a monorepo)
  default: "."
  validator: "{% from 'includes/dir.jinja' import dir_error %}{{ dir_error(go_dir, 'services/api') }}"

# Who opens dependency-update PRs. Both get the same rules: weekly, a one-week cooldown,
# grouped actions, hooks and dev tooling, and no updates to the copier-owned FROM tags.
# Only Dependabot also groups npm security updates (docs/tooling.md#dependencies).
dependency_bot:
  type: str
  ask: "{{ customise }}"
  help: Which bot opens dependency updates
  choices:
    Dependabot (built into GitHub, nothing to install): dependabot
    Renovate (needs the Renovate GitHub App on the repo): renovate
  default: dependabot

codecov:
  type: bool
  when: "{{ 'python' in stacks or 'ts' in stacks }}"
  ask: "{{ customise }}"
  help: Upload test coverage to Codecov (needs a CODECOV_TOKEN repository secret)
  default: false

codspeed:
  type: bool
  when: "{{ 'python' in stacks or 'rust' in stacks }}"
  ask: "{{ customise }}"
  help: Benchmark pull requests on CodSpeed (needs the repository imported on codspeed.io)
  default: false

# --- python -------------------------------------------------------------------

module_name:
  type: str
  when: "{{ 'python' in stacks }}"
  ask: "{{ customise }}"
  help: Importable Python module name
  default: "{{ slug|replace('-', '_')|replace('.', '_') }}"
  validator: >-
    {% set keywords = ['and', 'as', 'assert', 'async', 'await', 'break', 'class', 'continue', 'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield'] %}
    {% if not module_name|regex_search('^[a-z_][a-z0-9_]*$') %}
    A module name is lower-case letters, digits and `_`, and cannot start with a digit.
    {% elif module_name in keywords %}
    `{{ module_name }}` is a Python keyword, so the package could not be imported: pick another module name.
    {% endif %}

# `flat` is for adopting the template in a repo whose package already sits at the
# root: no src/ stub, and no starter tests that import it. web-service,
# data-pipeline and the python image need the starter modules, so they stay `src`.
# docker_stacks is asked later, so its validator refuses flat with the python image.
python_layout:
  type: str
  when: "{{ 'python' in stacks }}"
  ask: "{{ customise }}"
  help: Where the package lives; flat keeps an existing package at the root and adds no stub
  choices:
    src/<module> (a new package): src
    <module>/ at the root (an existing package): flat
  default: src
  validator: >-
    {% if python_layout == 'flat' and kind in ('web-service', 'data-pipeline') %}
    The flat layout is for an existing library, app or research package: the web-service
    and data-pipeline kinds and the python image need their starter modules in src/.
    {% endif %}

# The default trails a new Python release by 90 days (renovate.json5), so the
# packages scaffolds install have wheels for it.
# renovate: datasource=python-version depName=python
python_version:
  type: str
  when: "{{ 'python' in stacks }}"
  ask: "{{ customise }}"
  help: Python version (3.12 or later)
  default: "3.14"
  validator: >-
    {% if not python_version|regex_search('^3\\.(1[2-9]|[2-9][0-9])$') %}
    Give a version from 3.12 up, as `3.14`: the template uses `type` statements.
    {% endif %}

# A library's requires-python floor and the oldest version its CI tests. SPEC 0
# supports a Python release for three years, about three minors, so the default is
# two minors below python_version, and never below the template's own 3.12.
python_min:
  type: str
  when: "{{ 'python' in stacks and kind == 'library' }}"
  ask: "{{ customise }}"
  help: Oldest Python the library supports (requires-python, tested in CI)
  default: "3.{{ [python_version.split('.')[1] | int - 2, 12] | max }}"
  validator: >-
    {% if not python_min|regex_search('^3\\.(1[2-9]|[2-9][0-9])$') %}
    Give a version from 3.12 up, as `3.13`: the template uses `type` statements.
    {% elif python_min.split('.')[1]|int > python_version.split('.')[1]|int %}
    The oldest supported version can't be newer than python_version ({{ python_version }}).
    {% endif %}

publish_to_pypi:
  type: bool
  when: "{{ 'python' in stacks and kind == 'library' }}"
  ask: "{{ customise }}"
  help: Add a release workflow publishing to PyPI via trusted publishing (needs setup on pypi.org first)
  default: false

# --- ts -----------------------------------------------------------------------

# The address the accessibility statement and privacy page name. The default is
# the address Cloudflare Pages gives the project from wrangler.jsonc's name.
site_url:
  type: str
  when: "{{ 'ts' in stacks and ts_kind == 'web-app' }}"
  ask: "{{ customise }}"
  help: The web app's public address, for its accessibility statement and privacy page
  default: "https://{{ slug | replace('.', '-') | replace('_', '-') }}.pages.dev"
  validator: >-
    {% if not site_url|regex_search('^https://[^/\\s]+(/[^\\s]*)?$') %}
    Give the full address, starting with https://.
    {% endif %}

# Computed, never asked: the date the legal pages start from. They are the
# project's files from then on (_skip_if_exists), so an update never rewrites it.
legal_date:
  type: str
  when: false
  # Not %-d, which strftime on Windows rejects.
  default: "{{ '%d %B %Y' | strftime | regex_replace('^0', '') }}"

# renovate: datasource=node-version depName=node
node_version:
  type: str
  when: "{{ 'ts' in stacks }}"
  ask: "{{ customise }}"
  help: Node.js major version
  default: "26"

publish_to_npm:
  type: bool
  when: "{{ 'ts' in stacks and ts_kind == 'library' }}"
  ask: "{{ customise }}"
  help: Add a release workflow publishing to npm via trusted publishing (needs setup on npmjs.com first)
  default: false

# --- rust ---------------------------------------------------------------------

# The crate's rust-version: its minimum supported Rust version (MSRV). Clippy
# reads it too, and skips lints that suggest newer APIs. Defaults to the current stable minor.
# renovate: datasource=github-releases depName=rust-lang/rust
rust_version:
  type: str
  when: "{{ 'rust' in stacks }}"
  ask: "{{ customise }}"
  help: Minimum supported Rust version (Cargo.toml rust-version)
  default: "1.99.0"
  validator: >-
    {% if not rust_version|regex_search('^1\\.(8[5-9]|9[0-9]|[1-9][0-9]{2,})(\\.[0-9]+)?$') %}
    Give 1.85 or later, as `1.85` or `1.85.0`: Cargo.toml uses edition 2024.
    {% endif %}

# --- go -----------------------------------------------------------------------

go_module:
  type: str
  when: "{{ 'go' in stacks }}"
  ask: "{{ customise }}"
  help: Go module path (go.mod `module`)
  default: "github.com/{{ github_user }}/{{ slug }}"
  # go_package is computed, and copier skips validators on computed questions,
  # so its check lives here. A binary is package main and never uses it.
  validator: >-
    {% set pkg = slug|regex_replace('[^a-z0-9]', '') %}
    {% set keywords = ['break', 'case', 'chan', 'const', 'continue', 'default', 'defer', 'else', 'fallthrough', 'for', 'func', 'go', 'goto', 'if', 'import', 'interface', 'main', 'map', 'package', 'range', 'return', 'select', 'struct', 'switch', 'type', 'var'] %}
    {% if go_kind == 'binary' %}
    {% elif not pkg|regex_search('^[a-z_][a-z0-9_]*$') %}
    The Go package name would be `{{ pkg }}`, which is not a valid identifier: start the project name with a letter.
    {% elif pkg in keywords %}
    A library named `{{ pkg }}` can't be a Go package: it is a Go keyword or `main`. Pick another project name.
    {% endif %}

# go.mod's `go` directive: the oldest Go the module builds with, and the
# language version the linters check against. Defaults to the current stable
# minor. golangci-lint must be built with at least this Go.
# renovate: datasource=golang-version depName=go versioning=semver-coerced
go_version:
  type: str
  when: "{{ 'go' in stacks }}"
  ask: "{{ customise }}"
  help: Minimum Go version (go.mod `go` directive)
  default: "1.27"

# Computed, never asked: the committed the pr-title workflow runs. The commit-msg hook
# pins its own rev in .pre-commit-config.yaml, which the dependency bot moves.
# renovate: datasource=pypi depName=committed
committed_version:
  type: str
  when: false
  default: 1.1.11

# Computed, never asked: the uv the generated workflows install. Pinned because
# CI runs `uv audit`, a preview command that can change in any uv release.
# renovate: datasource=pypi depName=uv
uv_version:
  type: str
  when: false
  default: 0.13.0

# Computed, never asked: the griffe that python.yml's api job and `just py-check` run
# with uvx when publish_to_pypi is on. It compares the public API with the last git tag.
# renovate: datasource=pypi depName=griffe
griffe_version:
  type: str
  when: false
  default: 2.3.2

# Computed, never asked: the golangci-lint release that the README and go.yml pin,
# kept in one place. `just go-check` runs whichever golangci-lint is on PATH. Renovate bumps it from its `# renovate:` line.
# renovate: datasource=github-releases depName=golangci/golangci-lint
golangci_lint_version:
  type: str
  when: false
  default: v2.14.0

# The govulncheck a new go.mod requires as a tool. Dependabot bumps it in the
# project after that.
# renovate: datasource=go depName=golang.org/x/vuln
govulncheck_version:
  type: str
  when: false
  default: v1.9.0

# --- test extras --------------------------------------------------------------

# Library kinds only: their public API has to hold for any caller's input. Property
# tests run with the rest of the tests. Mutation testing takes minutes to hours and
# its score is noisy, so it runs weekly in CI (never on a pull request) and as a recipe by hand.
test_extras:
  type: str
  multiselect: true
  when: >-
    {{ ('python' in stacks and kind == 'library') or ('ts' in stacks and ts_kind == 'library')
    or ('rust' in stacks and rust_kind == 'library') or ('go' in stacks and go_kind == 'library') }}
  ask: "{{ customise }}"
  help: Extra tests for the library code (none, one or both)
  choices:
    Property tests (generated inputs checked against a rule, run with the tests): property
    Mutation testing (a `just <stack>-mutation` recipe and a weekly CI run that check the tests catch planted bugs): mutation
  default: []

# Computed, never asked: the versions a new project starts on. Dependabot bumps
# them in the project after that.
# renovate: datasource=crate depName=proptest
proptest_version:
  type: str
  when: false
  default: 1.12.0

# renovate: datasource=crate depName=codspeed-divan-compat
divan_version:
  type: str
  when: false
  default: 6.0.0

# Computed, never asked: the gremlins that `just go-mutation` runs with `go run`.
# Not a go.mod tool, which would pull its ~34 modules into the project's module
# graph. `copier update` bumps it; Renovate bumps it here.
# renovate: datasource=go depName=github.com/go-gremlins/gremlins
gremlins_version:
  type: str
  when: false
  default: v0.6.0

# Computed, never asked: the tools mutation.yml installs. `copier update` bumps them;
# Renovate bumps them here.
# renovate: datasource=github-releases depName=casey/just
just_version:
  type: str
  when: false
  default: 1.59.0

# renovate: datasource=crate depName=cargo-mutants
cargo_mutants_version:
  type: str
  when: false
  default: 27.1.0

# --- docker -------------------------------------------------------------------

# Asked even without `customise`: the right images depend on the stacks, and its
# validator reads the *_dir answers, so it stays after them.
docker_stacks:
  type: str
  multiselect: true
  when: "{{ 'docker' in stacks }}"
  help: Which stacks get an image (one Dockerfile each, one compose service each)
  choices: [python, ts]
  default: [python]
  # Each image builds from its stack's package, and two Dockerfiles cannot share a
  # directory, so two images need a monorepo layout.
  validator: >-
    {% if not docker_stacks %}
    Pick at least one stack to build an image from.
    {% elif docker_stacks | reject('in', stacks) | list %}
    An image needs its stack: add {{ docker_stacks | reject('in', stacks) | join(' and ') }} to `stacks` too.
    {% elif 'python' in docker_stacks and python_layout == 'flat' %}
    The flat layout is for an existing library, app or research package: the web-service
    and data-pipeline kinds and the python image need their starter modules in src/.
    {% elif 'ts' in docker_stacks and ts_kind == 'web-app' %}
    The ts image is a Node service with /health. A web app is static files that
    Cloudflare Pages serves: drop ts from `docker_stacks`.
    {% elif kind == 'web-service' and 'python' not in docker_stacks %}
    The web-service kind is the python image: add python to `docker_stacks`.
    {% elif docker_stacks | length > 1 and python_dir == ts_dir %}
    Both images would be written to {{ python_dir }}/Dockerfile. Answer yes to
    `customise` and give python_dir
    and ts_dir different values first.
    {% endif %}

app_port:
  type: int
  when: "{{ 'docker' in stacks }}"
  ask: "{{ customise }}"
  help: Port the service listens on
  default: 8000
  # A second image publishes on the next host port up (compose.yaml).
  validator: >-
    {% if app_port < 1 or app_port > 65535 %}
    Give a port from 1 to 65535.
    {% elif docker_stacks | length > 1 and app_port == 65535 %}
    The second image publishes on port {{ app_port + 1 }}, which doesn't exist: pick a lower port.
    {% endif %}

publish_to_ghcr:
  type: bool
  when: "{{ 'docker' in stacks }}"
  ask: "{{ customise }}"
  help: Push the image to GitHub Container Registry (CI builds it either way)
  default: false
