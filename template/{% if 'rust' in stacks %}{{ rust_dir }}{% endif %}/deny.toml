# cargo-deny: `just rs-check` and CI run `cargo deny check` against this file.

# Vulnerabilities always fail; yanked and unmaintained crates are reported too.
[advisories]

[licenses]
# Permissive licenses only; this crate's own is among them. Add an exception
# per crate rather than widening the list.
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
# The list is policy, not an inventory: allowed licenses nothing uses yet are fine.
unused-allowed-license = "allow"

# Crates with `publish = false`, this one included, are not license-checked.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

# crates.io only: a git dependency or another registry fails the check.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
