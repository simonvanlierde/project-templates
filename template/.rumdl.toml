[global]
  # READMEs have long badge and link lines that don't wrap, so MD013 would flag nearly every line.
  disable = ["MD013"]
  flavor  = "gfm"

[per-file-ignores]
  # PR templates open with a section, not a level-1 heading. The glob also matches
  # template/.github/ when this file lints the templates repo.
  "**/PULL_REQUEST_TEMPLATE.md" = ["MD041"]
