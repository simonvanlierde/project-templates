name: pr title

# A squash merge makes the pull request title the commit subject on main, so the title
# follows committed.toml, as each commit does through the commit-msg hook. Runs again
# when the title is edited.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

env:
  # renovate: datasource=pypi depName=committed
  COMMITTED_VERSION: 1.1.11

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: committed.toml
          sparse-checkout-cone-mode: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          UV_MALWARE_CHECK: "1"
          UV_PREVIEW_FEATURES: malware-check
        run: printf '%s\n' "$TITLE" | uvx "committed@$COMMITTED_VERSION" --config committed.toml --commit-file -
