name: lint

# This repo's own config, checked: the git hooks, and Renovate's extraction.

# The push trigger seeds the Renovate npm cache: a PR-ref cache is readable by that
# PR alone.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    # `prek install` is opt-in per clone, so a commit made without hooks would reach
    # main unchecked. Scaffolds get the same job in checks.yml.
    name: git hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # prek is the action author's own binary, so the digest pin is the trust anchor.
      # Hook revs are pinned in .pre-commit-config.yaml.
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          # betterleaks scans staged changes only and CI stages nothing. GitHub secret
          # scanning covers the server side.
          SKIP: betterleaks
          # Enables zizmor's online audits (impostor commits, known-vulnerable actions).
          # Read-only.
          GH_TOKEN: ${{ github.token }}

  renovate:
    # The regex managers in renovate.json5 match nothing when a pattern drifts. Run the
    # extraction and assert each manager still finds its anchor dependency.
    name: renovate extract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Renovate bumps it via githubActionsVersions.
      # renovate: datasource=npm depName=renovate
      RENOVATEBOT_VERSION: 44.116.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Renovate supports only the active node LTS line.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Without this cache, the cold npx install is the longest step in this job.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-renovate-${{ env.RENOVATEBOT_VERSION }}
          # A bump PR still reuses the previous version's shared tarballs.
          restore-keys: npm-renovate-

      - name: extract and assert anchors
        env:
          RENOVATE_CONFIG_FILE: renovate.json5
          LOG_LEVEL: debug
        run: |-
          set -euo pipefail
          npx -y "renovate@$RENOVATEBOT_VERSION" --platform=local --dry-run=extract > extract.log 2>&1 \
            || { tail -n 50 extract.log; exit 1; }
          # One anchor per manager block. copier and renovate come from the
          # githubActionsVersions preset, which also matches nothing silently when it drifts.
          for dep in actions/checkout ghcr.io/astral-sh/uv pre-commit/pre-commit-hooks \
                     uv_build pytest pnpm @biomejs/biome copier renovate; do
            grep -qF "\"depName\": \"$dep\"" extract.log \
              || { echo "not extracted: $dep — a manager pattern in renovate.json5 broke"; exit 1; }
          done
