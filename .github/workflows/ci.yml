name: ci

# Renders the real answer combinations with copier, then runs the generated
# project's own inner loop.

# No push trigger: main only advances through a PR, so a push run repeats
# the check that already passed on the PR head.
on:
  # No paths-ignore: `ci ok` is a required check, and a skipped workflow
  # leaves it pending forever. The whole run takes under a minute anyway.
  pull_request:
  # Scaffolds break when upstream moves (a new uv, pnpm or hook release), not
  # when this repo does — so also run on a schedule.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Pinned for reproducibility; Renovate bumps these via githubActionsVersions.
env:
  # renovate: datasource=pypi depName=copier
  COPIER_VERSION: 9.18.2
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.30.1
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: 1.7.12
  # renovate: datasource=pypi depName=check-jsonschema
  CHECK_JSONSCHEMA_VERSION: 0.38.2
  # renovate: datasource=pypi depName=rust-just
  JUST_VERSION: 1.58.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # The python stack (+ docker). The library row's module_name != project_name
    # exercises the uv_build module-name path. The data-pipeline row also runs its
    # pipeline, as its generated python.yml does. Images build nested (monorepo)
    # and at the root (web-service).
    name: python (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: library
            project_name: ci-smoke
            module_name: smokepkg
            stacks: "[python]"
            python_dir: "."
            kind: library
          # The nested layout built for real: the build context is a subdirectory.
          - name: monorepo
            project_name: ci-mono-py
            module_name: ci_mono_py
            stacks: "[python,docker]"
            python_dir: apps/api
            kind: library
          - name: data-pipeline
            project_name: ci-pipeline
            module_name: ci_pipeline
            stacks: "[python]"
            python_dir: "."
            kind: data-pipeline
          # FastAPI behind the image: also started, and its /health probed.
          - name: web-service
            project_name: ci-web
            module_name: ci_web
            stacks: "[python,docker]"
            python_dir: "."
            kind: web-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Default globs match nothing here (pins live in .jinja files), so key on
      # the template. Rows of one kind share dependencies, so they share a key.
      # Saved from main only: a PR-ref cache is readable by that PR alone.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: template/**/pyproject.toml.jinja
          cache-suffix: ${{ github.job }}-${{ matrix.kind }}
          save-cache: ${{ github.event_name != 'pull_request' }}

      # publish_to_pypi=true (asked only of a library) so the conditionally-named
      # python-release.yml renders too. Matrix values reach the shell as env:
      # project_name is free text.
      - name: scaffold
        env:
          PROJECT_NAME: ${{ matrix.project_name }}
          MODULE_NAME: ${{ matrix.module_name }}
          STACKS: ${{ matrix.stacks }}
          PYTHON_DIR: ${{ matrix.python_dir }}
          KIND: ${{ matrix.kind }}
          # Derived from stacks so a row can't gain docker and skip its answers.
          DOCKER: ${{ contains(matrix.stacks, 'docker') }}
        run: |
          set -euo pipefail
          # --vcs-ref=HEAD so CI tests the pushed commit, not the last tag.
          C=(uvx "copier@$COPIER_VERSION" copy --vcs-ref=HEAD --defaults --overwrite
             --data "project_name=$PROJECT_NAME"
             --data "module_name=$MODULE_NAME"
             --data "stacks=$STACKS"
             --data "python_dir=$PYTHON_DIR"
             --data "kind=$KIND")
          if [ "$KIND" = library ]; then C+=(--data publish_to_pypi=true); fi
          if [ "$DOCKER" = true ]; then C+=(--data 'docker_stacks=[python]'); fi
          "${C[@]}" . "$RUNNER_TEMP/proj"

      - run: uv tool install "rust-just==$JUST_VERSION"

      # The scaffold's own recipes, so the rendered justfile runs, not just
      # renders. `check` is the same commands the generated python.yml runs.
      # py-sync has no --locked: a fresh scaffold has no lockfile until it runs.
      # just finds the root justfile from a nested package dir.
      - name: inner loop
        working-directory: ${{ runner.temp }}/proj/${{ matrix.python_dir }}
        run: just py-sync check

      # Against the example source's live URL, then the tests that read its output.
      - if: matrix.kind == 'data-pipeline'
        name: pipeline
        working-directory: ${{ runner.temp }}/proj/${{ matrix.python_dir }}
        env:
          PIPELINE_OUTPUT_REQUIRED: "1"
        run: |
          just pipeline
          uv run pytest tests/test_published.py
          ls data/raw/*.fetch.json

      # The runner's default builder loads the image, so the web-service row
      # can run it below.
      - if: contains(matrix.stacks, 'docker')
        name: docker build
        env:
          CONTEXT: ${{ runner.temp }}/proj/${{ matrix.python_dir }}
          IMAGE: ${{ matrix.project_name }}:ci
        run: docker build -t "$IMAGE" "$CONTEXT"

      # The image serves, and the HEALTHCHECK it ships turns healthy.
      - if: matrix.kind == 'web-service'
        name: container health
        env:
          IMAGE: ${{ matrix.project_name }}:ci
        run: |
          set -euo pipefail
          docker run -d --name svc -p 127.0.0.1:8000:8000 "$IMAGE"
          for _ in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' svc)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' svc | grep -qx healthy
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'

  render:
    # Renders the branches the default answers reach, which the jobs above skip,
    # and stops at "does the output parse".
    name: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv runs copier and the linters here, so key on this file, which pins them.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/ci.yml
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.event_name != 'pull_request' }}

      # Also runnable locally; see the script's header.
      - name: render and check
        run: scripts/check-render.sh "$RUNNER_TEMP"

      # The workflow templates are .jinja, and no linter can parse them. Their
      # rendered output is ordinary YAML, so audit that instead — across all
      # four renders, which between them cover every conditional branch.
      # Scaffolded repos get the same audit as a git hook.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx "zizmor@$ZIZMOR_VERSION" "$RUNNER_TEMP"/a "$RUNNER_TEMP"/b "$RUNNER_TEMP"/c "$RUNNER_TEMP"/d

      # What zizmor doesn't check: unknown keys, bad `needs`, expression types,
      # and shellcheck over every `run:` (shellcheck ships on the runner).
      # Upstream's prebuilt binary, as the root hook runs upstream's source. Its
      # releases are mutable, so the checksums file guards the download only.
      - name: actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin="$RUNNER_TEMP/actionlint-bin" asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v$ACTIONLINT_VERSION" -R rhysd/actionlint -D "$bin" \
            -p "$asset" -p "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd "$bin" && sha256sum --check --ignore-missing "actionlint_${ACTIONLINT_VERSION}_checksums.txt")
          tar -xzf "$bin/$asset" -C "$bin" actionlint
          "$bin/actionlint" "$RUNNER_TEMP"/[abcd]/.github/workflows/*.yml

      # The same schema the rendered hook validates against.
      - name: CITATION.cff schema
        run: |
          uvx --from "check-jsonschema==$CHECK_JSONSCHEMA_VERSION" check-jsonschema \
            --builtin-schema vendor.citation-file-format "$RUNNER_TEMP"/a/CITATION.cff "$RUNNER_TEMP"/d/CITATION.cff

  update:
    # Scaffolds from the last tag, then `copier update`s to the pushed commit —
    # the path scaffolded projects actually take.
    name: update from last tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # copier needs the tags to pick the update base

      # uv only runs copier here; the typescript rows share this key.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/ci.yml
          cache-suffix: copier
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: scaffold at last tag, update to HEAD
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --abbrev=0)
          PROJ="$RUNNER_TEMP/proj"
          git init -q "$PROJ"
          uvx "copier@$COPIER_VERSION" copy --vcs-ref="$TAG" --defaults --overwrite \
            --data project_name=update-me --data 'stacks=[python,ts,docker]' \
            --data 'docker_stacks=[python]' . "$PROJ"
          # The answers name the canonical GitHub source; point this update at
          # the pushed commit instead.
          sed -i "s|^_src_path: .*|_src_path: $GITHUB_WORKSPACE|" "$PROJ/.copier-answers.yml"
          git -C "$PROJ" add -A
          git -C "$PROJ" -c user.email=ci@invalid -c user.name=ci commit -qm scaffold
          uvx "copier@$COPIER_VERSION" update --vcs-ref=HEAD --defaults "$PROJ"
          # Conflicts don't fail the update; leftover .rej files are the signal.
          test -z "$(find "$PROJ" -name '*.rej' -print -quit)"

  typescript:
    # The ts stack (+ docker). The image builds nested (monorepo); the root
    # Dockerfile is the same template, rendered by the render job.
    name: typescript (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # A project_name carrying the punctuation `slug` has to strip.
          - name: library
            project_name: 'Ci "TS" Lib'
            stacks: "[ts]"
            ts_dir: "."
          # The nested package installed and built, not only rendered.
          - name: monorepo
            project_name: ci-mono-ts
            stacks: "[ts,docker]"
            ts_dir: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv only runs copier here, so key on this file, which pins it.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/ci.yml
          cache-suffix: copier
          save-cache: ${{ github.event_name != 'pull_request' }}

      # publish_to_npm=true so the conditionally-named ts-release.yml renders
      # too. project_name via env: one row's value contains quotes.
      - name: scaffold
        env:
          PROJECT_NAME: ${{ matrix.project_name }}
          STACKS: ${{ matrix.stacks }}
          TS_DIR: ${{ matrix.ts_dir }}
          # Derived from stacks so a row can't gain docker and skip its answers.
          DOCKER: ${{ contains(matrix.stacks, 'docker') }}
        run: |
          set -euo pipefail
          C=(uvx "copier@$COPIER_VERSION" copy --vcs-ref=HEAD --defaults --overwrite
             --data "project_name=$PROJECT_NAME"
             --data "stacks=$STACKS"
             --data "ts_dir=$TS_DIR"
             --data ts_kind=library
             --data publish_to_npm=true)
          if [ "$DOCKER" = true ]; then C+=(--data 'docker_stacks=[ts]'); fi
          "${C[@]}" . "$RUNNER_TEMP/proj"

      # Read by hand: pnpm/setup resolves paths relative to GITHUB_WORKSPACE,
      # and the scaffold lives in RUNNER_TEMP. pnpm from the packageManager pin;
      # node from the answer copier recorded, not engines.node, an open range.
      - name: versions
        id: v
        env:
          TS_DIR: ${{ matrix.ts_dir }}
        run: |
          set -euo pipefail
          pnpm=$(jq -er '.packageManager | ltrimstr("pnpm@")' "$RUNNER_TEMP/proj/$TS_DIR/package.json")
          node=$(sed -n 's/^node_version: *//p' "$RUNNER_TEMP/proj/.copier-answers.yml" | tr -d "\"'")
          test -n "$pnpm" && test -n "$node"
          { echo "pnpm=$pnpm"; echo "node=$node"; } >> "$GITHUB_OUTPUT"

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: ${{ steps.v.outputs.pnpm }}
          runtime: node@${{ steps.v.outputs.node }}
          install: false

      # Not a cache-dependency-path: this scaffold has no lockfile yet.
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('template/**/package.json.jinja') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: uv tool install "rust-just==$JUST_VERSION"

      # The scaffold's own recipes; `check` is the same commands the generated
      # ts.yml runs. ts-sync has no --frozen-lockfile: a fresh scaffold has no
      # pnpm-lock.yaml until this install writes it.
      - name: inner loop
        working-directory: ${{ runner.temp }}/proj
        run: just ts-sync check

      - if: contains(matrix.stacks, 'docker')
        name: docker build
        env:
          CONTEXT: ${{ runner.temp }}/proj/${{ matrix.ts_dir }}
        run: docker build "$CONTEXT"

  rust:
    # The rust stack, one row per crate kind: the library flat, the binary nested.
    name: rust (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: library
            project_name: ci-rs-lib
            rust_dir: "."
            rust_kind: library
          - name: binary
            project_name: ci-rs-bin
            rust_dir: crates/cli
            rust_kind: binary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv only runs copier here, so key on this file, which pins it.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/ci.yml
          cache-suffix: copier
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: scaffold
        env:
          PROJECT_NAME: ${{ matrix.project_name }}
          RUST_DIR: ${{ matrix.rust_dir }}
          RUST_KIND: ${{ matrix.rust_kind }}
        run: |
          uvx "copier@$COPIER_VERSION" copy --vcs-ref=HEAD --defaults --overwrite \
            --data "project_name=$PROJECT_NAME" --data 'stacks=[rust]' \
            --data "rust_dir=$RUST_DIR" --data "rust_kind=$RUST_KIND" . "$RUNNER_TEMP/proj"

      # The toolchain the generated rust.yml installs, at the same pins.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest,cargo-deny

      - run: uv tool install "rust-just==$JUST_VERSION"

      # The scaffold's own recipe; `rs-check` is the same commands the generated
      # rust.yml runs. No --locked: a fresh scaffold has no Cargo.lock yet.
      - name: inner loop
        working-directory: ${{ runner.temp }}/proj
        run: just rs-check

  ok:
    # The one check the main ruleset requires, so matrix rows can change
    # without touching repo settings. always(): a skipped job must fail it.
    name: ci ok
    if: always()
    needs: [python, render, update, typescript, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
