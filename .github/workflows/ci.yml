name: ci

# Renders the real answer combinations with copier, then runs the generated
# project's own inner loop.

# No push trigger: main only advances through a PR, so a push run repeats
# the check that already passed on the PR head.
on:
  pull_request:
    # Only the root README; every other .md is template output.
    paths-ignore: [README.md]
  # Scaffolds break when upstream moves (a new uv, pnpm or hook release), not
  # when this repo does — so also run on a schedule.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Pinned for reproducibility; Renovate bumps both via githubActionsVersions.
env:
  # renovate: datasource=pypi depName=copier
  COPIER_VERSION: 9.17.0
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.28.0
  # No .dockerbuild record artifacts; nothing reads them here.
  DOCKER_BUILD_RECORD_UPLOAD: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # The python stack (+ docker). The library row's module_name != project_name
    # exercises the uv_build module-name path. The data-pipeline row also runs its
    # pipeline, as its generated python.yml does.
    name: python (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: library
            project_name: ci-smoke
            module_name: smokepkg
            stacks: "[python]"
            python_dir: "."
            kind: library
          - name: docker
            project_name: ci-docker-py
            module_name: ci_docker_py
            stacks: "[python,docker]"
            python_dir: "."
            kind: library
          # The nested layout built for real: the build context is a subdirectory.
          - name: monorepo
            project_name: ci-mono-py
            module_name: ci_mono_py
            stacks: "[python,docker]"
            python_dir: apps/api
            kind: library
          - name: data-pipeline
            project_name: ci-pipeline
            module_name: ci_pipeline
            stacks: "[python]"
            python_dir: "."
            kind: data-pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Default globs match nothing here (pins live in .jinja files), so key on
      # the template. matrix.name in the suffix keeps the rows off one key.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: template/**/pyproject.toml.jinja
          cache-suffix: ${{ github.job }}-${{ matrix.name }}

      # publish_to_pypi=true (asked only of a library) so the conditionally-named
      # python-release.yml renders too. Matrix values reach the shell as env:
      # project_name is free text.
      - name: scaffold
        env:
          PROJECT_NAME: ${{ matrix.project_name }}
          MODULE_NAME: ${{ matrix.module_name }}
          STACKS: ${{ matrix.stacks }}
          PYTHON_DIR: ${{ matrix.python_dir }}
          KIND: ${{ matrix.kind }}
          # Derived from stacks so a row can't gain docker and skip its answers.
          DOCKER: ${{ contains(matrix.stacks, 'docker') }}
        run: |
          set -euo pipefail
          # --vcs-ref=HEAD so CI tests the pushed commit, not the last tag.
          C=(uvx "copier@$COPIER_VERSION" copy --vcs-ref=HEAD --defaults --overwrite
             --data "project_name=$PROJECT_NAME"
             --data "module_name=$MODULE_NAME"
             --data "stacks=$STACKS"
             --data "python_dir=$PYTHON_DIR"
             --data "kind=$KIND")
          if [ "$KIND" = library ]; then C+=(--data publish_to_pypi=true); fi
          if [ "$DOCKER" = true ]; then C+=(--data 'docker_stacks=[python]'); fi
          "${C[@]}" . "$RUNNER_TEMP/proj"

      # The same commands the generated python.yml runs. No --locked: a fresh
      # scaffold has no lockfile until uv sync writes one.
      - name: inner loop
        working-directory: ${{ runner.temp }}/proj/${{ matrix.python_dir }}
        run: |
          uv sync
          uv run ruff check
          uv run ruff format --check
          uv run ty check
          uv run pytest

      # Against the example source's live URL, then the tests that read its output.
      - if: matrix.kind == 'data-pipeline'
        name: pipeline
        working-directory: ${{ runner.temp }}/proj/${{ matrix.python_dir }}
        env:
          PROJECT_NAME: ${{ matrix.project_name }}
          PIPELINE_OUTPUT_REQUIRED: "1"
        run: |
          uv run "$PROJECT_NAME" fetch
          uv run "$PROJECT_NAME" build
          uv run "$PROJECT_NAME" validate
          uv run pytest
          ls data/raw/*.fetch.json

      # buildx for the gha layer cache.
      - if: contains(matrix.stacks, 'docker')
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - if: contains(matrix.stacks, 'docker')
        name: docker build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ runner.temp }}/proj/${{ matrix.python_dir }}
          push: false
          # Scoped per row: on the default shared scope these unrelated images
          # would evict each other.
          cache-from: type=gha,scope=${{ github.job }}-${{ matrix.name }}
          # Export only on push: a PR-ref cache is dropped on merge, so mode=max
          # there uploads MBs nothing reads.
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}-{1}', github.job, matrix.name) || '' }}

  render:
    # Renders the branches the default answers reach, which the jobs above skip,
    # and stops at "does the output parse".
    name: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv only runs copier here, so key on this file, which pins it.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/ci.yml
          cache-suffix: ${{ github.job }}

      # All three stacks at once, everything else at its defaults. module_name
      # is withheld so its slug-derived default is what renders.
      - name: render defaults
        run: |
          set -euo pipefail
          uvx "copier@$COPIER_VERSION" copy --vcs-ref=HEAD --defaults --overwrite \
            --data project_name=render-me --data 'stacks=[python,ts,docker]' \
            --data kind=research --data ts_kind=app \
            --data 'docker_stacks=[python]' . "$RUNNER_TEMP/a"

      # The only render with nested paths, at two different depths to catch
      # hardcoded up-paths. All three publish flags on: the only render where the
      # two release workflows could collide, and the only one where docker.yml
      # grows its pushing half — the branch holding the write scopes zizmor most
      # needs to see.
      - name: render monorepo
        run: |
          set -euo pipefail
          uvx "copier@$COPIER_VERSION" copy --vcs-ref=HEAD --defaults --overwrite \
            --data project_name=mono-me --data 'stacks=[python,ts,docker]' \
            --data python_dir=api --data ts_dir=apps/web \
            --data publish_to_pypi=true --data publish_to_npm=true \
            --data 'docker_stacks=[python,ts]' --data publish_to_ghcr=true . "$RUNNER_TEMP/c"

      # The data-pipeline variant nested and beside docker: the nested paths reach
      # .gitignore, the workflow's artifact path and ATTRIBUTION.md.
      - name: render data-pipeline
        run: |
          set -euo pipefail
          uvx "copier@$COPIER_VERSION" copy --vcs-ref=HEAD --defaults --overwrite \
            --data project_name=pipe-me --data 'stacks=[python,docker]' \
            --data kind=data-pipeline --data python_dir=pipe \
            --data 'docker_stacks=[python]' . "$RUNNER_TEMP/d"

      # license=none, plus a name and description carrying the punctuation
      # `slug` strips and `to_json` escapes.
      - name: render license=none
        run: |
          set -euo pipefail
          uvx "copier@$COPIER_VERSION" copy --vcs-ref=HEAD --defaults --overwrite \
            --data 'project_name=Odd "Name" & Co!' \
            --data 'project_description=A "quoted" one' \
            --data license=none --data 'stacks=[ts,docker]' \
            --data 'docker_stacks=[ts]' . "$RUNNER_TEMP/b"

      - name: parse everything rendered
        run: |
          set -euo pipefail
          uv run --no-project --with pyyaml python - <<'PY'
          import json, os, pathlib, tomllib, yaml

          load = {".json": json.loads, ".toml": tomllib.loads,
                  ".yml": yaml.safe_load, ".yaml": yaml.safe_load}
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          seen = 0
          for path in sorted(tmp.glob("[abcd]/**/*")):
              parse = load.get(path.suffix)
              if parse and path.is_file():
                  parse(path.read_text())
                  seen += 1
          print(f"parsed {seen} files")
          # A copier run that silently rendered nothing would otherwise pass.
          assert seen > 20, f"only {seen} structured files rendered"
          PY

      - name: check the conditional branches landed
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # kind=research adds two dirs; publishing off on both stacks removes
          # both release workflows.
          test -f a/data/README.md
          test -f a/notebooks/.gitkeep
          test ! -e a/.github/workflows/python-release.yml
          test ! -e a/.github/workflows/ts-release.yml
          grep -q 'Private :: Do Not Upload' a/pyproject.toml
          grep -q '"private": true' a/package.json
          # module_name fell back to its slug-derived default.
          test -f a/src/render_me/__main__.py
          # The .vscode files rendered valid recommendations per stack.
          grep -q charliermarsh.ruff a/.vscode/extensions.json
          grep -q biomejs.biome a/.vscode/settings.json
          test -f a/.github/SECURITY.md
          # Rendered from a local checkout, the answers file still names the
          # canonical source, never the path it was rendered from.
          grep -qx '_src_path: gh:simonvanlierde/project-templates' a/.copier-answers.yml
          # All three stacks at once: every hook block present together.
          grep -q hadolint a/.pre-commit-config.yaml
          grep -q 'ruff check' a/.pre-commit-config.yaml
          grep -q 'biome check' a/.pre-commit-config.yaml
          # license=none: no file, and no license key in either place that carries one.
          test ! -e b/LICENSE
          ! grep -q '"license"' b/package.json
          ! grep -q 'image.licenses' b/Dockerfile
          # The awkward project name reduced to something npm will accept.
          grep -q '"name": "odd-name--co"' b/package.json
          # Monorepo: packages nested, root files at the root, one Dockerfile
          # per context.
          test -f c/api/pyproject.toml
          test -f c/apps/web/package.json
          test -f c/api/Dockerfile
          test -f c/apps/web/Dockerfile
          test -f c/compose.yaml
          test -f c/.github/workflows/python.yml
          test ! -e c/pyproject.toml
          grep -q 'working-directory: api' c/.github/workflows/python.yml
          grep -q 'context: apps/web' c/compose.yaml
          grep -q 'uv --directory api' c/just/python.just
          # Both stacks publishing: two release workflows, neither overwritten.
          test -f c/.github/workflows/python-release.yml
          test -f c/.github/workflows/ts-release.yml
          # publish_to_ghcr=true: docker.yml rendered its pushing half.
          grep -q 'packages: write' c/.github/workflows/docker.yml
          # The depth-derived up-paths, at both depths this render uses.
          grep -qF '](../README.md)' c/api/README.md
          grep -qF '"root": "../.."' c/apps/web/biome.json
          # data-pipeline: manifest and data dirs in the package, the rest at the root.
          test -f d/pipe/sources.toml
          test -f d/pipe/src/pipe_me/pipeline.py
          test -f d/pipe/data/raw/.gitkeep
          test -f d/ATTRIBUTION.md
          test ! -e d/pipe/notebooks
          grep -qx 'pipe/data/raw/\*' d/.gitignore
          grep -q 'path: pipe/data/raw/\*.fetch.json' d/.github/workflows/python.yml
          grep -q '^pipeline: fetch build validate' d/just/python.just
          # Only data-pipeline renders it.
          test ! -e a/sources.toml
          test ! -e a/ATTRIBUTION.md

      # The workflow templates are .jinja, and no linter can parse them. Their
      # rendered output is ordinary YAML, so audit that instead — across all
      # four renders, which between them cover every conditional branch.
      # Scaffolded repos get the same audit as a git hook.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx "zizmor@$ZIZMOR_VERSION" "$RUNNER_TEMP"/a "$RUNNER_TEMP"/b "$RUNNER_TEMP"/c "$RUNNER_TEMP"/d

  update:
    # Scaffolds from the last tag, then `copier update`s to the pushed commit —
    # the path scaffolded projects actually take.
    name: update from last tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # copier needs the tags to pick the update base

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/ci.yml
          cache-suffix: ${{ github.job }}

      - name: scaffold at last tag, update to HEAD
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          # Updating across the layered-to-merged restructure is documented as
          # unsupported, so there is nothing to test until a merged-era tag exists.
          if [ -z "$TAG" ] || ! git cat-file -e "${TAG}:template" 2>/dev/null; then
            echo "last tag ${TAG:-<none>} predates the merged template; skipping"
            exit 0
          fi
          PROJ="$RUNNER_TEMP/proj"
          git init -q "$PROJ"
          uvx "copier@$COPIER_VERSION" copy --vcs-ref="$TAG" --defaults --overwrite \
            --data project_name=update-me --data 'stacks=[python,ts,docker]' \
            --data 'docker_stacks=[python]' . "$PROJ"
          # The answers name the canonical GitHub source; point this update at
          # the pushed commit instead.
          sed -i "s|^_src_path: .*|_src_path: $GITHUB_WORKSPACE|" "$PROJ/.copier-answers.yml"
          git -C "$PROJ" add -A
          git -C "$PROJ" -c user.email=ci@invalid -c user.name=ci commit -qm scaffold
          uvx "copier@$COPIER_VERSION" update --vcs-ref=HEAD --defaults "$PROJ"
          # Conflicts don't fail the update; leftover .rej files are the signal.
          test -z "$(find "$PROJ" -name '*.rej' -print -quit)"

  typescript:
    # The ts stack (+ docker).
    name: typescript (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # A project_name carrying the punctuation `slug` has to strip.
          - name: library
            project_name: 'Ci "TS" Lib'
            stacks: "[ts]"
            ts_dir: "."
          - name: docker
            project_name: ci-ts-docker
            stacks: "[ts,docker]"
            ts_dir: "."
          # The nested package installed and built, not only rendered.
          - name: monorepo
            project_name: ci-mono-ts
            stacks: "[ts,docker]"
            ts_dir: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv only runs copier here, so key on this file, which pins it. matrix.name
      # in the suffix keeps the three rows off one key.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/ci.yml
          cache-suffix: ${{ github.job }}-${{ matrix.name }}

      # publish_to_npm=true so the conditionally-named ts-release.yml renders
      # too. project_name via env: one row's value contains quotes.
      - name: scaffold
        env:
          PROJECT_NAME: ${{ matrix.project_name }}
          STACKS: ${{ matrix.stacks }}
          TS_DIR: ${{ matrix.ts_dir }}
          # Derived from stacks so a row can't gain docker and skip its answers.
          DOCKER: ${{ contains(matrix.stacks, 'docker') }}
        run: |
          set -euo pipefail
          C=(uvx "copier@$COPIER_VERSION" copy --vcs-ref=HEAD --defaults --overwrite
             --data "project_name=$PROJECT_NAME"
             --data "stacks=$STACKS"
             --data "ts_dir=$TS_DIR"
             --data ts_kind=library
             --data publish_to_npm=true)
          if [ "$DOCKER" = true ]; then C+=(--data 'docker_stacks=[ts]'); fi
          "${C[@]}" . "$RUNNER_TEMP/proj"

      # pnpm version from the scaffold's packageManager pin, read by hand:
      # action-setup resolves package_json_file relative to GITHUB_WORKSPACE,
      # and the scaffold lives in RUNNER_TEMP.
      - name: pnpm version
        id: pnpm
        env:
          TS_DIR: ${{ matrix.ts_dir }}
        run: |
          set -euo pipefail
          v=$(jq -er '.packageManager | ltrimstr("pnpm@")' "$RUNNER_TEMP/proj/$TS_DIR/package.json")
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # From the answer copier recorded, so it cannot drift from the template's
      # default. Not engines.node, which is an open range.
      - name: node version
        id: node
        run: |
          set -euo pipefail
          v=$(sed -n 's/^node_version: *//p' "$RUNNER_TEMP/proj/.copier-answers.yml" | tr -d "\"'")
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: ${{ steps.pnpm.outputs.version }}
          runtime: node@${{ steps.node.outputs.version }}
          install: false

      # Not a cache-dependency-path: this scaffold has no lockfile yet.
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('template/**/package.json.jinja') }}
          restore-keys: pnpm-${{ runner.os }}-

      # The same commands the generated ts.yml runs. No --frozen-lockfile: a
      # fresh scaffold has no pnpm-lock.yaml until this install writes it.
      - name: inner loop
        working-directory: ${{ runner.temp }}/proj/${{ matrix.ts_dir }}
        run: |
          pnpm install
          pnpm run check
          pnpm run typecheck
          pnpm run test
          pnpm run build

      - if: contains(matrix.stacks, 'docker')
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - if: contains(matrix.stacks, 'docker')
        name: docker build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ runner.temp }}/proj/${{ matrix.ts_dir }}
          push: false
          cache-from: type=gha,scope=${{ github.job }}-${{ matrix.name }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}-{1}', github.job, matrix.name) || '' }}
