name: ci

# This repo's own git hooks and Renovate config, then the real answer combinations
# rendered with copier and run through the generated project's own inner loop.
# `ci ok` gates main on all of it.

# No push trigger: main only advances through a PR, so a push run repeats the PR check.
on:
  # No paths-ignore: `ci ok` is a required check, and a skipped workflow leaves it pending.
  pull_request:
  # Also on a schedule: scaffolds break when upstream releases change, not when this repo does.
  # The scheduled run on main also seeds the caches every PR can read.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Renovate bumps these via githubActionsVersions.
env:
  # The identity answers copier.yml leaves blank, for every render below.
  COPIER_SETTINGS_PATH: ${{ github.workspace }}/.github/ci-copier-settings.yml
  # renovate: datasource=github-releases depName=j178/prek
  PREK_VERSION: 0.5.5
  # renovate: datasource=pypi depName=copier
  COPIER_VERSION: 9.19.1
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.30.1
  # renovate: datasource=github-releases depName=jdx/jactionlint
  JACTIONLINT_VERSION: 2.2.0
  # renovate: datasource=pypi depName=check-jsonschema
  CHECK_JSONSCHEMA_VERSION: 0.38.2
  # renovate: datasource=pypi depName=rust-just
  JUST_VERSION: 1.58.0
  # renovate: datasource=npm depName=renovate
  RENOVATEBOT_VERSION: 44.155.8

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    # `prek install` is opt-in per clone, so a commit made without hooks would reach
    # main unchecked. Scaffolds get the same job in checks.yml.
    name: git hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # prek is the action author's own binary, so the digest pin is the trust anchor.
      # Hook revs are pinned in .pre-commit-config.yaml.
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: ${{ env.PREK_VERSION }}
        env:
          # betterleaks scans staged changes only and CI stages nothing. GitHub secret
          # scanning covers the server side.
          # zizmor runs in the next step, the only one given a token.
          SKIP: betterleaks,zizmor

      # zizmor's online audits (impostor commits, known-vulnerable actions) need a token.
      # It is read-only, and only this hook sees it, not every third-party hook above.
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: ${{ env.PREK_VERSION }}
          extra-args: zizmor --all-files
        env:
          GH_TOKEN: ${{ github.token }}

  renovate:
    # The regex managers in renovate.json5 match nothing when a pattern drifts. Run the
    # extraction and assert each manager still finds its anchor dependency.
    name: renovate extract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout

      # Renovate supports only the active node LTS line.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Without this cache, the cold npx install is the longest step in this job.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-renovate-${{ env.RENOVATEBOT_VERSION }}
          # A bump PR still reuses the previous version's shared tarballs.
          restore-keys: npm-renovate-

      - name: extract and assert anchors
        env:
          RENOVATE_CONFIG_FILE: renovate.json5
          LOG_LEVEL: debug
        run: |-
          set -euo pipefail
          npm_config_ignore_scripts=true npx -y "renovate@$RENOVATEBOT_VERSION" --platform=local --dry-run=extract > extract.log 2>&1 \
            || { tail -n 50 extract.log; exit 1; }
          # One anchor per manager block (rust-lang/rust: copier.yml). copier and renovate come from the
          # githubActionsVersions preset, which also matches nothing silently when it drifts.
          for dep in actions/checkout ghcr.io/astral-sh/uv pre-commit/pre-commit-hooks \
                     uv_build pytest pnpm @biomejs/biome rust-lang/rust copier renovate; do
            grep -qF "\"depName\": \"$dep\"" extract.log \
              || { echo "not extracted: $dep — a manager pattern in renovate.json5 broke"; exit 1; }
          done

  python:
    # Python stack, with docker. The library row's module_name differs from project_name,
    # which exercises the uv_build module-name path. The data-pipeline row also runs its
    # pipeline, as its generated python.yml does. Images build nested (monorepo) and at
    # the root (web-service). A row leaves out an answer that keeps its default: stacks
    # [python], python_dir `.`, and the slug-derived module_name.
    name: python (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: library
            project_name: ci-smoke
            module_name: smokepkg
            kind: library
          # Property tests and the mutation recipe, run once to prove the recipe works.
          - name: library (test extras)
            project_name: ci-extras
            kind: library
            test_extras: "[property,mutation]"
          # Nested layout: the build context is a subdirectory.
          - name: monorepo
            project_name: ci-mono-py
            stacks: "[python,docker]"
            python_dir: apps/api
            kind: library
          - name: app
            project_name: ci-app
            kind: app
          # Adds JupyterLab to the dev group.
          - name: research
            project_name: ci-research
            kind: research
          # With docker, so the image build covers the pipeline's dependencies.
          - name: data-pipeline
            project_name: ci-pipeline
            stacks: "[python,docker]"
            kind: data-pipeline
          # Also starts the FastAPI container and probes /health.
          - name: web-service
            project_name: ci-web
            stacks: "[python,docker]"
            kind: web-service
    steps:
      - *checkout

      # The default globs match nothing (pins live in .jinja files), so key on the template.
      # Rows of one kind share dependencies. Saved from main only: a PR-ref cache is
      # readable by that PR alone.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: template/**/pyproject.toml.jinja
          cache-suffix: ${{ github.job }}-${{ matrix.kind }}
          save-cache: ${{ github.event_name != 'pull_request' }}

      # publish_to_pypi=true (asked only of a library) renders the conditionally named
      # python-release.yml. Matrix values go through env: project_name is free text.
      - name: scaffold
        env:
          PROJECT_NAME: ${{ matrix.project_name }}
          MODULE_NAME: ${{ matrix.module_name }}
          STACKS: ${{ matrix.stacks || '[python]' }}
          PYTHON_DIR: ${{ matrix.python_dir }}
          KIND: ${{ matrix.kind }}
          TEST_EXTRAS: ${{ matrix.test_extras }}
          # Derived from stacks so a row can't add docker and skip its answers.
          DOCKER: ${{ contains(matrix.stacks, 'docker') }}
        run: |
          set -euo pipefail
          # --vcs-ref=HEAD tests the pushed commit, not the last tag.
          C=(uvx "copier@$COPIER_VERSION" copy --vcs-ref=HEAD --defaults --overwrite
             --data "project_name=$PROJECT_NAME"
             --data "stacks=$STACKS"
             --data "kind=$KIND")
          if [ -n "$MODULE_NAME" ]; then C+=(--data "module_name=$MODULE_NAME"); fi
          if [ -n "$PYTHON_DIR" ]; then C+=(--data "python_dir=$PYTHON_DIR"); fi
          if [ "$KIND" = library ]; then C+=(--data publish_to_pypi=true); fi
          if [ -n "$TEST_EXTRAS" ]; then C+=(--data "test_extras=$TEST_EXTRAS"); fi
          if [ "$DOCKER" = true ]; then C+=(--data 'docker_stacks=[python]'); fi
          "${C[@]}" . "$RUNNER_TEMP/proj"
          # TODO(2026-10-27): delete. certifi 2026.10.19 fixes GHSA-6q48-6c7w-9gw2, which
          # uv audit fails on, but was uploaded 2026-10-20, inside the one-week
          # exclude-newer. Only this CI's renders take it early; scaffolds are unchanged.
          sed -i 's/^exclude-newer = "1 week"$/&\nexclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }/' \
            "$RUNNER_TEMP/proj/${PYTHON_DIR:-.}/pyproject.toml"
          grep -q '^exclude-newer-package' "$RUNNER_TEMP/proj/${PYTHON_DIR:-.}/pyproject.toml"

      - &just
        run: uv tool install "rust-just==$JUST_VERSION"

      - &soft-audit
        # A new OSV advisory fails `uv audit` in every render at once, whatever a pull
        # request changed. On pull requests, this wrapper ahead of uv on PATH turns an
        # audit failure into a warning and passes every other uv call through, so the
        # rendered recipes still run unchanged. The weekly run has no wrapper and fails.
        # The update and fullstack jobs reuse this step.
        if: github.event_name == 'pull_request'
        name: uv audit warns on pull requests
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/soft-audit"
          mkdir -p "$dir"
          cat >"$dir/uv" <<EOF
          #!/bin/sh
          case " \$* " in
            *" audit "*) "$(command -v uv)" "\$@" || echo "::warning::uv audit failed; the weekly run fails on this" ;;
            *) exec "$(command -v uv)" "\$@" ;;
          esac
          EOF
          chmod +x "$dir/uv"
          echo "$dir" >>"$GITHUB_PATH"

      # The scaffold's own recipes, so the rendered justfile runs. `check` runs the same
      # commands as the generated python.yml.
      # py-sync has no --locked: a fresh scaffold has no lockfile.
      # just finds the root justfile from a nested package dir.
      - name: inner loop
        working-directory: ${{ runner.temp }}/proj/${{ matrix.python_dir }}
        run: just py-sync check

      - if: matrix.test_extras
        working-directory: ${{ runner.temp }}/proj/${{ matrix.python_dir }}
        run: just py-mutation

      # The library's python.yml tests every version from python_min up. Run the
      # tests on each, so a floor the code can't meet fails here.
      - if: matrix.kind == 'library'
        name: tests on every supported python
        working-directory: ${{ runner.temp }}/proj/${{ matrix.python_dir }}
        run: |
          set -euo pipefail
          versions=$(yq -o=tsv '.jobs.check.strategy.matrix.python' "$RUNNER_TEMP/proj/.github/workflows/python.yml")
          for v in $versions; do UV_PYTHON=$v just py-sync py-test; done

      # Runs the pipeline against the example source's live URL, then the tests that
      # read its output.
      - if: matrix.kind == 'data-pipeline'
        name: pipeline
        working-directory: ${{ runner.temp }}/proj/${{ matrix.python_dir }}
        env:
          PIPELINE_OUTPUT_REQUIRED: "1"
        run: |
          just pipeline
          uv run pytest tests/test_published.py
          ls data/raw/*.fetch.json

      # The runner's default builder loads the image so the web-service row can run it.
      - if: contains(matrix.stacks, 'docker')
        name: docker build
        env:
          CONTEXT: ${{ runner.temp }}/proj/${{ matrix.python_dir }}
          IMAGE: ${{ matrix.project_name }}:ci
        run: docker build -t "$IMAGE" "$CONTEXT"

      # The image serves, and the HEALTHCHECK it ships turns healthy.
      - if: matrix.kind == 'web-service'
        name: container health
        env:
          IMAGE: ${{ matrix.project_name }}:ci
        run: |
          set -euo pipefail
          docker run -d --name svc -p 127.0.0.1:8000:8000 "$IMAGE"
          for _ in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' svc)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' svc | grep -qx healthy
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'

  render:
    # Renders the branches the jobs above skip and checks only that the output parses.
    name: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout

      # uv runs copier and the linters here; key on this file, which pins them.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/ci.yml
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: render and check
        run: scripts/check-render.sh "$RUNNER_TEMP"

      # No linter can parse the .jinja workflows, so audit the rendered output. The four
      # renders together cover every conditional branch. Scaffolds get the same audit as a
      # git hook.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx "zizmor@$ZIZMOR_VERSION" "$RUNNER_TEMP"/a "$RUNNER_TEMP"/b "$RUNNER_TEMP"/c "$RUNNER_TEMP"/d

      # Checks what zizmor doesn't: unknown keys, bad `needs`, expression types, and
      # shellcheck over every `run:` (shellcheck ships on the runner).
      # Upstream's prebuilt binary. Its releases are mutable, so the checksums file only
      # guards the download.
      - name: jactionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bin="$RUNNER_TEMP/jactionlint-bin" asset="jactionlint_${JACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v$JACTIONLINT_VERSION" -R jdx/jactionlint -D "$bin" \
            -p "$asset" -p "jactionlint_${JACTIONLINT_VERSION}_checksums.txt"
          (cd "$bin" && sha256sum --check --ignore-missing "jactionlint_${JACTIONLINT_VERSION}_checksums.txt")
          tar -xzf "$bin/$asset" -C "$bin" jactionlint
          "$bin/jactionlint" "$RUNNER_TEMP"/[abcd]/.github/workflows/*.yml

      # The same schema the rendered hook validates against.
      - name: CITATION.cff schema
        run: |
          uvx --from "check-jsonschema==$CHECK_JSONSCHEMA_VERSION" check-jsonschema \
            --builtin-schema vendor.citation-file-format "$RUNNER_TEMP"/[acd]/CITATION.cff

  update:
    # Scaffolds from the last tag, then runs `copier update` to the pushed commit, as a
    # real project does.
    name: update from last tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # copier needs the tags to pick the update base

      - &setup-uv-copier
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        # uv only runs copier here and in the typescript, rust and go jobs, which
        # reuse this step and so share its cache key.
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/ci.yml
          cache-suffix: copier
          save-cache: ${{ github.event_name != 'pull_request' }}

      - *just

      - *soft-audit

      # A nested package with a local change, as a real project has one: the change must
      # survive the update, and the result must still pass its own checks.
      - name: scaffold at last tag, edit, update to HEAD
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --abbrev=0)
          PROJ="$RUNNER_TEMP/proj"
          git init -q "$PROJ"
          uvx "copier@$COPIER_VERSION" copy --vcs-ref="$TAG" --defaults --overwrite \
            --data project_name=update-me --data 'stacks=[python,ts,docker]' \
            --data python_dir=api --data 'docker_stacks=[python]' . "$PROJ"
          # The answers name the GitHub source; point the update at the pushed commit.
          sed -i "s|^_src_path: .*|_src_path: $GITHUB_WORKSPACE|" "$PROJ/.copier-answers.yml"
          uv add -q --directory "$PROJ/api" 'attrs>=25'
          git -C "$PROJ" add -A
          git -C "$PROJ" -c user.email=ci@invalid -c user.name=ci commit -qm scaffold
          # --conflict rej: the default inline markers would pass every check unseen.
          uvx "copier@$COPIER_VERSION" update --vcs-ref=HEAD --defaults --conflict rej "$PROJ"
          test -z "$(find "$PROJ" -name '*.rej' -print -quit)"
          grep -q '"attrs>=25' "$PROJ/api/pyproject.toml"
          cd "$PROJ/api" && just py-sync py-check

      # A data-pipeline project, updated the way the changelog's upgrade steps say: relock,
      # then the locked sync its own CI runs, then its checks. py-sync would relock silently.
      - name: data-pipeline at last tag, update to HEAD
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --abbrev=0)
          PROJ="$RUNNER_TEMP/pipe"
          git init -q "$PROJ"
          uvx "copier@$COPIER_VERSION" copy --vcs-ref="$TAG" --defaults --overwrite \
            --data project_name=pipe-me --data 'stacks=[python]' --data kind=data-pipeline . "$PROJ"
          sed -i "s|^_src_path: .*|_src_path: $GITHUB_WORKSPACE|" "$PROJ/.copier-answers.yml"
          (cd "$PROJ" && uv lock -q)
          git -C "$PROJ" add -A
          git -C "$PROJ" -c user.email=ci@invalid -c user.name=ci commit -qm scaffold
          uvx "copier@$COPIER_VERSION" update --vcs-ref=HEAD --defaults --conflict rej "$PROJ"
          test -z "$(find "$PROJ" -name '*.rej' -print -quit)"
          cd "$PROJ" && uv lock -q && uv sync -q --locked && just check

  typescript:
    # TS stack, with docker. The image builds nested (monorepo). The root Dockerfile is
    # the same template, and the render job renders it. A row leaves out an answer that
    # keeps its default: stacks [ts] and ts_dir `.`.
    name: typescript (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # A project_name with punctuation that `slug` strips.
          - name: library
            project_name: 'Ci "TS" Lib'
            ts_kind: library
          # Nested, so a report the mutation run writes beside the package must be
          # gitignored there too: ts-check runs again after it.
          - name: library (test extras)
            project_name: ci-ts-extras
            ts_dir: apps/lib
            ts_kind: library
            test_extras: "[property,mutation]"
          - name: app
            project_name: ci-ts-app
            ts_kind: app
          # Installs and builds the nested package, not only renders it.
          - name: monorepo
            project_name: ci-mono-ts
            stacks: "[ts,docker]"
            ts_dir: apps/web
            ts_kind: library
          # Both web frameworks, one at the root and one nested. Each also runs its
          # Playwright specs.
          - name: web-app (react)
            project_name: ci-ts-web
            ts_kind: web-app
            web_framework: react
          - name: web-app (preact, nested)
            project_name: ci-ts-web-preact
            ts_dir: apps/web
            ts_kind: web-app
            web_framework: preact
    env:
      TS_DIR: ${{ matrix.ts_dir }}
    steps:
      - *checkout

      - *setup-uv-copier

      # publish_to_npm=true (asked only of a library) renders the conditionally named
      # ts-release.yml. project_name goes through env: one row's value contains quotes.
      - name: scaffold
        env:
          PROJECT_NAME: ${{ matrix.project_name }}
          STACKS: ${{ matrix.stacks || '[ts]' }}
          TS_KIND: ${{ matrix.ts_kind }}
          WEB_FRAMEWORK: ${{ matrix.web_framework }}
          TEST_EXTRAS: ${{ matrix.test_extras }}
          # Derived from stacks so a row can't add docker and skip its answers.
          DOCKER: ${{ contains(matrix.stacks, 'docker') }}
        run: |
          set -euo pipefail
          C=(uvx "copier@$COPIER_VERSION" copy --vcs-ref=HEAD --defaults --overwrite
             --data "project_name=$PROJECT_NAME"
             --data "stacks=$STACKS"
             --data "ts_kind=$TS_KIND")
          if [ -n "$TS_DIR" ]; then C+=(--data "ts_dir=$TS_DIR"); fi
          if [ -n "$WEB_FRAMEWORK" ]; then C+=(--data "web_framework=$WEB_FRAMEWORK"); fi
          if [ "$TS_KIND" = library ]; then C+=(--data publish_to_npm=true); fi
          if [ -n "$TEST_EXTRAS" ]; then C+=(--data "test_extras=$TEST_EXTRAS"); fi
          if [ "$DOCKER" = true ]; then C+=(--data 'docker_stacks=[ts]'); fi
          "${C[@]}" . "$RUNNER_TEMP/proj"

      - &ts-versions
        # Read by hand: pnpm/setup resolves paths against GITHUB_WORKSPACE, and the scaffold
        # lives in RUNNER_TEMP. pnpm comes from the packageManager pin. Node comes from the
        # copier answer, since engines.node is an open range.
        # The fullstack job reuses this step and the next, with its own TS_DIR.
        name: versions
        id: v
        run: |
          set -euo pipefail
          pnpm=$(jq -er '.packageManager | ltrimstr("pnpm@")' "$RUNNER_TEMP/proj/$TS_DIR/package.json")
          node=$(sed -n 's/^node_version: *//p' "$RUNNER_TEMP/proj/.copier-answers.yml" | tr -d "\"'")
          test -n "$pnpm" && test -n "$node"
          { echo "pnpm=$pnpm"; echo "node=$node"; } >> "$GITHUB_OUTPUT"

      - &pnpm-setup
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: ${{ steps.v.outputs.pnpm }}
          runtime: node@${{ steps.v.outputs.node }}
          install: false

      # Not a cache-dependency-path: this scaffold has no lockfile yet.
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('template/**/package.json.jinja') }}
          restore-keys: pnpm-${{ runner.os }}-

      - *just

      # The scaffold's own recipes; `check` runs the same commands as the generated
      # ts.yml. ts-sync has no --frozen-lockfile: the install writes pnpm-lock.yaml.
      - name: inner loop
        working-directory: ${{ runner.temp }}/proj
        run: just ts-sync check

      # Then the checks again: biome reads .gitignore, so a report left unignored fails them.
      - if: matrix.test_extras
        working-directory: ${{ runner.temp }}/proj
        run: just ts-mutation ts-check

      # The accessibility and CSP specs. Chromium installs on the runner here; the
      # generated ts.yml runs the same specs in the Playwright container.
      - if: matrix.ts_kind == 'web-app'
        name: e2e
        working-directory: ${{ runner.temp }}/proj/${{ matrix.ts_dir }}
        run: |
          pnpm exec playwright install --with-deps chromium
          just ts-e2e

      - if: contains(matrix.stacks, 'docker')
        name: docker build
        env:
          CONTEXT: ${{ runner.temp }}/proj/${{ matrix.ts_dir }}
        run: docker build "$CONTEXT"

  fullstack:
    # Python and ts in one repo, each nested: the root justfile imports both recipe
    # files, and `check` runs both stacks. Both get an image, on a non-default port.
    name: python + ts + docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TS_DIR: web
    steps:
      - *checkout

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: template/**/pyproject.toml.jinja
          cache-suffix: ${{ github.job }}
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: scaffold
        run: |
          uvx "copier@$COPIER_VERSION" copy --vcs-ref=HEAD --defaults --overwrite \
            --data project_name=ci-fullstack --data 'stacks=[python,ts,docker]' \
            --data python_dir=api --data ts_dir=web \
            --data 'docker_stacks=[python,ts]' --data app_port=9000 . "$RUNNER_TEMP/proj"

      - *ts-versions

      - *pnpm-setup

      - *just

      - *soft-audit

      - name: inner loop
        working-directory: ${{ runner.temp }}/proj
        run: just py-sync ts-sync check

      # --wait holds until both HEALTHCHECKs pass. The second service's host port is
      # app_port + 1.
      - name: compose up
        working-directory: ${{ runner.temp }}/proj
        run: |
          docker compose up -d --build --wait
          curl -fsS http://127.0.0.1:9000/health
          curl -fsS http://127.0.0.1:9001/health

  rust:
    # The rust stack, one row per crate kind: the library flat (rust_dir left at its
    # default `.`), the binary nested.
    name: rust (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: library
            project_name: ci-rs-lib
            rust_kind: library
          - name: library (test extras)
            project_name: ci-rs-extras
            rust_kind: library
            test_extras: "[property,mutation]"
          - name: binary
            project_name: ci-rs-bin
            rust_dir: crates/cli
            rust_kind: binary
    steps:
      - *checkout

      - *setup-uv-copier

      - name: scaffold
        env:
          PROJECT_NAME: ${{ matrix.project_name }}
          RUST_DIR: ${{ matrix.rust_dir }}
          RUST_KIND: ${{ matrix.rust_kind }}
          TEST_EXTRAS: ${{ matrix.test_extras }}
        run: |
          set -euo pipefail
          C=(uvx "copier@$COPIER_VERSION" copy --vcs-ref=HEAD --defaults --overwrite
             --data "project_name=$PROJECT_NAME" --data 'stacks=[rust]'
             --data "rust_kind=$RUST_KIND")
          if [ -n "$RUST_DIR" ]; then C+=(--data "rust_dir=$RUST_DIR"); fi
          if [ -n "$TEST_EXTRAS" ]; then C+=(--data "test_extras=$TEST_EXTRAS"); fi
          "${C[@]}" . "$RUNNER_TEMP/proj"

      # The toolchain the generated rust.yml installs, at the same pins.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest,cargo-deny${{ matrix.test_extras && ',cargo-mutants' || '' }}

      - *just

      # The scaffold's own recipes. `rs-check` runs the same commands as the
      # generated rust.yml. `rs-sync` writes the Cargo.lock a fresh scaffold lacks.
      - name: inner loop
        working-directory: ${{ runner.temp }}/proj
        run: just rs-sync rs-check

      - if: matrix.test_extras
        working-directory: ${{ runner.temp }}/proj
        run: just rs-mutation

  go:
    # The go stack, one row per module kind: the library flat (go_dir left at its
    # default `.`), the binary nested.
    # The library's hyphenated name makes its package name differ from its
    # import path, which the Example's import has to handle.
    name: go (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: library
            project_name: ci-go-lib
            go_kind: library
          - name: library (test extras)
            project_name: ci-go-extras
            go_kind: library
            test_extras: "[property,mutation]"
          - name: binary
            project_name: ci-go-bin
            go_dir: services/cli
            go_kind: binary
    steps:
      - *checkout

      - *setup-uv-copier

      - name: scaffold
        env:
          PROJECT_NAME: ${{ matrix.project_name }}
          GO_DIR: ${{ matrix.go_dir }}
          GO_KIND: ${{ matrix.go_kind }}
          TEST_EXTRAS: ${{ matrix.test_extras }}
        run: |
          set -euo pipefail
          C=(uvx "copier@$COPIER_VERSION" copy --vcs-ref=HEAD --defaults --overwrite
             --data "project_name=$PROJECT_NAME" --data 'stacks=[go]'
             --data "go_kind=$GO_KIND")
          if [ -n "$GO_DIR" ]; then C+=(--data "go_dir=$GO_DIR"); fi
          if [ -n "$TEST_EXTRAS" ]; then C+=(--data "test_extras=$TEST_EXTRAS"); fi
          "${C[@]}" . "$RUNNER_TEMP/proj"

      # The golangci-lint the generated go.yml pins: a computed copier answer,
      # so read from copier.yml rather than the answers file.
      - name: versions
        id: v
        run: |
          set -euo pipefail
          lint=$(sed -n '/^golangci_lint_version:/,/^$/s/^  default: //p' copier.yml)
          test -n "$lint"
          echo "golangci-lint=$lint" >> "$GITHUB_OUTPUT"

      # Go from the scaffold's go.mod, as the generated go.yml does. No cache:
      # a fresh scaffold's only dependency is govulncheck, which go-sync fetches.
      # go-mutation fetches gremlins itself with `go run`.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ runner.temp }}/proj/${{ matrix.go_dir }}/go.mod
          cache: false

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.v.outputs.golangci-lint }}
          install-only: true
          skip-cache: true

      - *just

      # The scaffold's own recipe. `go-check` runs what the generated go.yml runs, plus
      # a separate format check that go.yml gets from its golangci-lint run.
      - name: inner loop
        working-directory: ${{ runner.temp }}/proj
        run: just go-sync go-check

      - if: matrix.test_extras
        working-directory: ${{ runner.temp }}/proj
        run: just go-mutation

  ok:
    # The one check the main ruleset requires, so jobs and matrix rows can change
    # without touching repo settings. always(): a skipped job must fail it.
    name: ci ok
    if: always()
    needs: [hooks, renovate, python, render, update, typescript, rust, go, fullstack]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |-
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
