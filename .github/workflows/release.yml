name: release

# A pushed version tag becomes a GitHub release whose notes are that version's
# CHANGELOG.md section. Releases here are immutable, so the notes must be right the
# first time: a tag with no section fails before anything is published.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# One group per tag: a re-pushed tag waits for its running release, and no tag's
# release cancels or replaces another's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # scripts/tag-release.sh signs the tag. A lightweight or unverified one publishes
      # nothing.
      - name: refuse a tag GitHub cannot verify
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r type sha < <(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "$type" != tag ]; then
            echo "$TAG is a lightweight tag; make it with scripts/tag-release.sh" >&2
            exit 1
          fi
          if [ "$(gh api "repos/$REPO/git/tags/$sha" --jq '.verification.verified')" != true ]; then
            echo "GitHub cannot verify the signature on $TAG" >&2
            exit 1
          fi

      - name: notes from the CHANGELOG section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash template/.github/scripts/release-notes.sh "$TAG" >"$RUNNER_TEMP/notes.md"

      - name: create the release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          # A release made by hand before this run is left as it is: immutable releases can't be edited.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; leaving it"
            exit 0
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
