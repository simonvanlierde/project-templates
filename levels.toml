# The practice ladder: what a public repo made from this template does at each level.
# `just levels-doc` writes the table in docs/usage.md#levels from this file.
#
# A repo meets a level when it meets every requirement at that level and below that
# applies to it. A requirement applies to every repo when `traits` is empty, otherwise to
# a repo with any of the traits listed. `since` is the date a requirement starts to count:
# before then a report shows it without lowering the repo's level.
#
# `version` is the template release this file ships in. It moves with the template's tags
# (the levels-doc check holds it to the newest release in CHANGELOG.md), so a report can
# say which version of the ladder a repo meets.
#
# Fields: area, level (minimal, standard, community), traits (web, cli, package,
# pipeline, numerics), text (one line), source (the standard and its version, or
# "project-templates" for a practice of this template's own), verify (automated: a
# script can check it from the repo or its settings; review: a person has to judge it),
# since (a date).

version = "0.14.0"

# --- minimal: any public repo ---------------------------------------------------------

[requirement.lockfile]
area = "supply chain"
level = "minimal"
traits = []
text = "A lockfile is committed beside each root `pyproject.toml` or `package.json`."
source = "OpenSSF Scorecard v5 (Pinned-Dependencies)"
verify = "automated"
since = 2026-11-11

[requirement.dependency-bot]
area = "supply chain"
level = "minimal"
traits = []
text = "Dependabot or Renovate opens update pull requests for the repo's dependencies."
source = "OpenSSF Scorecard v5 (Dependency-Update-Tool)"
verify = "automated"
since = 2026-11-11

[requirement.workflow-hardening]
area = "supply chain"
level = "minimal"
traits = []
text = "Every workflow sets `permissions:`, checks out with `persist-credentials: false` and has no `pull_request_target` trigger."
source = "OpenSSF Scorecard v5 (Token-Permissions, Dangerous-Workflow); OSPS Baseline v2026.08.28 (BR-01.01)"
verify = "automated"
since = 2026-11-11

[requirement.scorecard-workflow]
area = "supply chain"
level = "minimal"
traits = []
text = "The OpenSSF Scorecard workflow runs on the default branch."
source = "OpenSSF Scorecard v5"
verify = "automated"
since = 2026-11-11

[requirement.security-policy]
area = "community"
level = "minimal"
traits = []
text = "`SECURITY.md` says how to report a vulnerability privately and how soon you reply."
source = "OSPS Baseline v2026.08.28 (VM-02.01); OpenSSF Best Practices passing (vulnerability_report_process)"
verify = "automated"
since = 2026-11-11

# --- standard: the default for a public repo ------------------------------------------

[requirement.python-repo-review]
area = "supply chain"
level = "standard"
traits = []
text = "A repo with a root `pyproject.toml` passes Scientific Python repo-review."
source = "Scientific Python Development Guide (sp-repo-review)"
verify = "automated"
since = 2026-11-11

[requirement.license]
area = "community"
level = "standard"
traits = []
text = "`LICENSE` holds an OSI-approved license."
source = "OpenSSF Best Practices passing (floss_license); OSPS Baseline v2026.08.28 (LE-02.01)"
verify = "automated"
since = 2026-11-11

[requirement.community-files]
area = "community"
level = "standard"
traits = []
text = "The repo has `CONTRIBUTING.md`, a code of conduct, issue forms and a pull request template."
source = "GitHub community profile; OpenSSF Best Practices passing (contribution)"
verify = "automated"
since = 2026-11-11

[requirement.test-policy]
area = "community"
level = "standard"
traits = []
text = "`CONTRIBUTING.md` says that a change comes with tests and names the coding standards."
source = "OpenSSF Best Practices passing (test_policy, coding_standards)"
verify = "automated"
since = 2026-11-11

[requirement.changelog]
area = "releases"
level = "standard"
traits = []
