verify = "automated"
since = 2026-11-11

[requirement.security-headers]
area = "web"
level = "standard"
traits = ["web"]
text = "The site sends a Content-Security-Policy, and its root sends Strict-Transport-Security."
source = "OWASP Secure Headers Project"
verify = "automated"
since = 2026-11-11

[requirement.security-txt]
area = "web"
level = "standard"
traits = ["web"]
text = "The site root serves `/.well-known/security.txt` with a `Contact:` line."
source = "RFC 9116"
verify = "automated"
since = 2026-11-11

[requirement.sitemap-answers]
area = "web"
level = "standard"
traits = ["web"]
text = "Each sitemap that `robots.txt` names loads."
source = "RFC 9309; Sitemaps protocol 0.9"
verify = "automated"
since = 2026-11-11

