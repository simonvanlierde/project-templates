verify = "automated"
since = 2026-11-11

[requirement.citation-file]
area = "citation"
level = "standard"
traits = ["package", "pipeline", "numerics"]
text = "`CITATION.cff` says how to cite the software."
source = "Citation File Format 1.2.0"
verify = "automated"
since = 2026-11-11

[requirement.codemeta]
area = "citation"
level = "standard"
traits = ["package", "pipeline", "numerics"]
text = "`codemeta.json` describes the software for archives and registries."
source = "CodeMeta 3.0"
verify = "automated"
since = 2026-11-11

[requirement.readme]
area = "docs"
level = "standard"
traits = []
text = "`README.md` says what the project is, its status, and how to run or develop it (docs tier 0)."
source = "OpenSSF Best Practices passing (description_good, interact)"
verify = "review"
since = 2026-11-11

[requirement.cold-install]
area = "docs"
level = "standard"
traits = []
text = "A CI workflow runs the README's setup steps in a clean container."
source = "project-templates"
verify = "automated"
since = 2026-11-11

[requirement.docs-tier-1]
area = "docs"
level = "standard"
traits = ["package", "cli"]
text = "A README of under about 1,000 words is the front page, and `docs/` holds Markdown split into tutorials, how-to guides, reference and explanation, with the reference generated or tested against the code."
source = "Diátaxis"
verify = "review"
since = 2026-11-11

[requirement.docs-site]
area = "docs"
level = "standard"
traits = ["package", "cli"]
text = "Once outside users need search or versioned docs, or the reference is too big to browse as files, `docs/` builds a search-indexed site from the same Markdown (docs tier 2)."
source = "project-templates"
verify = "review"
since = 2026-11-11

[requirement.architecture-doc]
area = "docs"
level = "standard"
traits = []
text = "A repo with 40 or more code files (tests and fixtures not counted) has an architecture page with a Mermaid diagram, and each path or link it names exists."
source = "project-templates"
verify = "automated"
since = 2026-11-11

[requirement.accessibility-statement]
area = "docs"
level = "standard"
traits = ["web", "cli"]
text = "A web app publishes an accessibility statement and runs an axe scan in CI; a command-line tool has `docs/accessibility.md`."
