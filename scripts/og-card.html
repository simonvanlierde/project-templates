<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>project-templates social card</title>
<!-- `just og-card` renders this to docs/assets/og.png. Link previews show it at 255 to 500 px
     wide, and square thumbnails cut it to the centre 630 px (x 285 to 915), so the mark and
     the name sit there. Text stays at 36 px or more and 60 px clear of every edge. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #f8f5fa;
    color: #17191c;
    font-family: system-ui, "Segoe UI", sans-serif;
    border-top: 20px solid #5b2d6e;
    display: flex;
    justify-content: center;
  }
  main {
    width: 1080px;
    padding: 56px 0 52px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  img { width: 112px; height: 112px; display: block; margin: 0 auto 32px; }
  h1 { margin: 0; font-size: 62px; white-space: nowrap; line-height: 1; letter-spacing: -0.02em; font-weight: 750; }
  p { margin: 0; }
  .job { margin: 28px auto 0; max-width: 900px; font-size: 40px; line-height: 1.25; color: #3c424a; text-wrap: balance; }
  .address { font-size: 36px; font-weight: 600; color: #5b2d6e; }
</style>
<main>
  <div>
    <img src="../docs/assets/logo.svg" alt="">
    <h1>project-templates</h1>
    <p class="job">Start Python, TypeScript, Rust, Go and Docker repos, secure and kept current.</p>
  </div>
  <p class="address">simonvanlierde.com/project-templates</p>
</main>
