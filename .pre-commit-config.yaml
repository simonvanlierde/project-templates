# Run with prek, a drop-in pre-commit replacement: prek install && prek run -a
#
# The local half of CI: hygiene, secrets, and a zizmor audit of this repo's own
# workflows. The rendered-template checks stay in ci.yml — they need copier and
# a scaffold per answer combination.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        # The Apache license text is byte-exact from the GitHub licenses API.
        exclude: 'LICENSE.*\.jinja$'

  # JSON5 superset check: also parses renovate.json5, which check-json cannot.
  - repo: https://github.com/simonvanlierde/check-json5
    rev: v1.2.0
    hooks:
      - id: check-json5

  # Dogfooding: lint this repo's own YAML with the config it ships to scaffolds,
  # rather than keeping a second copy at the root.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, template/.yamllint.yml]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # .jinja workflows are not YAML, so zizmor only sees ci.yml and
  # renovate-extract.yml here; CI renders the templates and audits the output.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor

  # Dogfooded the same way as yamllint above.
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.46
    hooks:
      - id: rumdl
        args: [--fix, --config, template/.rumdl.toml]
