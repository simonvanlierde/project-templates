# Run with prek, a drop-in pre-commit replacement: prek install && prek run -a
#
# The local half of CI: hygiene, secrets and workflow audits. lint.yml runs
# these hooks on every PR. ci.yml runs scripts/check-render.sh separately.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        # The Apache license text is byte-exact from the GitHub licenses API.
        exclude: 'LICENSE.*\.jinja$'

  # Also parses renovate.json5, which check-json cannot.
  - repo: https://github.com/simonvanlierde/check-json5
    rev: v1.2.0
    hooks:
      - id: check-json5

  # Uses the template's own config to lint this repo's YAML.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, template/.yamllint.yml]

  # Successor to gitleaks, which now gets security fixes only.
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.9.0
    hooks:
      - id: betterleaks

  # Sees only ci.yml and lint.yml: .jinja workflows are not YAML. CI audits the
  # rendered output.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Uses the template's config, like yamllint.
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.78
    hooks:
      - id: rumdl
        args: [--fix, --config, template/.rumdl.toml]
