# Run with prek, a drop-in pre-commit replacement: prek install && prek run -a
#
# The local half of CI: hygiene, secrets and workflow audits. ci.yml's git hooks
# job runs these on every PR, beside scripts/check-render.sh. A pre-push hook
# has a 10-30 s budget; anything slower belongs in CI.
#
# Revs are commit SHAs, since tags are mutable; Renovate moves each SHA and its
# `# frozen:` tag together.

# `prek install` sets up both: the commit message is checked as you commit.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      # Parses template/.rumdl.toml, .tombi.toml, clippy.toml and deny.toml.
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: (^|/)LICENSES/|^template/[^/]*LICENSES[^/]*/|LICENSE.*\.jinja$
      - id: mixed-line-ending
        exclude: (^|/)LICENSES/|^template/[^/]*LICENSES[^/]*/|LICENSE.*\.jinja$
      - id: trailing-whitespace
        # Canonical licence text must keep its original bytes.
        exclude: (^|/)LICENSES/|^template/[^/]*LICENSES[^/]*/|LICENSE.*\.jinja$

  # Commit messages follow committed.toml, as in a generated project.
  - repo: https://github.com/crate-ci/committed
    rev: faeed42f2e10c244533a01525f13c4d8b6ce383f # frozen: v1.1.11
    hooks:
      - id: committed
        # git writes a merge commit's message itself, so skip the check during a merge.
        entry: sh -c 'test -f "$(git rev-parse --git-path MERGE_HEAD)" || exec committed "$@"' --

  # Every file has a copyright and license, from REUSE.toml or its own header.
  - repo: https://github.com/fsfe/reuse-tool
    rev: a1bb792acda6fd0724936b4ebbdbc8eceb9c0459 # frozen: v6.2.0
    hooks:
      - id: reuse

  # The dco workflow fails a pull request with an unsigned commit, so refuse one here. Merge
  # commits are skipped, as the workflow skips them.
  - repo: local
    hooks:
      - id: dco-signoff
        name: commit message has a Signed-off-by line (git commit -s)
        entry: sh -c 'test -f "$(git rev-parse --git-path MERGE_HEAD)" || grep -qE "^Signed-off-by:[ ].+ <[^>]+>[[:space:]]*$" "$1"' --
        language: system
        stages: [commit-msg]

  # Also parses renovate.json5, which check-json cannot.
  - repo: https://github.com/simonvanlierde/jsonvet
    rev: 022d320d5b971eccb28cfa6ce205152cbb382e53 # frozen: v3.2.0
    hooks:
      - id: jsonvet

  # The same config the template renders for a project with pnpm.
  # Formats first, so yamllint below sees the formatted file.
  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
    hooks:
      - id: yamlfmt
        args: [-conf, .yamlfmt]
        exclude: (^|/)pnpm-lock\.yaml$

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]

  # scripts/check-render.sh and scripts/render/; jactionlint covers only workflow `run:` blocks.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229 # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9 # frozen: v3.14.1-1
    hooks:
      - id: shfmt
        # Pinned to match .editorconfig's [*.sh], so the flags win over any
        # .editorconfig shfmt finds elsewhere.
        args: [--write, --indent=2]

  # Successor to gitleaks, which now gets security fixes only.
  - repo: https://github.com/betterleaks/betterleaks
    rev: 81aff7a638638aae3a659845d089043e1d8fe9ac # frozen: v1.9.0
    hooks:
      - id: betterleaks

  # Sees only ci.yml: .jinja workflows are not YAML. CI audits the
  # rendered output.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor

  - repo: https://github.com/jdx/jactionlint
    rev: a65ab044e916760429068fe5794b8306abdfcbb9 # frozen: v2.3.0
    hooks:
      - id: jactionlint

  # Uses the template's config, like yamllint.
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: eaeb8abc646954face3eb41726f085385410f761 # frozen: v0.3.1
    hooks:
      - id: rumdl
        args: [--fix, --config, template/.rumdl.toml]

  # The citation files and package manifests must agree (CITATION.cff is the source).
  - repo: https://github.com/simonvanlierde/citesync
    rev: a3c5a9794449e78a33583e456af41bb24ebd240e # frozen: v0.1.0
    hooks:
      - id: citesync
        additional_dependencies: [packaging==26.3, ruamel-yaml==0.19.1, tomlkit==0.15.2]

  # CITATION.cff against the official schema. GitHub's "Cite this repository"
  # silently drops a file that fails it.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df # frozen: 0.39.0
    hooks:
      - id: check-citation-file-format

  # Misspelt words in code, comments and docs. It fixes the ones it is sure of and
  # fails, so you review the fix. List a word it must leave alone in _typos.toml.
  - repo: https://github.com/crate-ci/typos
    rev: 7f9d0819ca1c008ade73f4b41fa9d258d48f605b # frozen: v1.51.1
    hooks:
      - id: typos
        # typos reads ruff's copyright rule code in the Python template's pyproject as a
        # misspelling of "copy". The rendered pyproject.toml passes, so the template file
        # alone is skipped.
        exclude: (^|/)LICENSES/|^template/[^/]*LICENSES[^/]*/|LICENSE.*\.jinja$|pyproject\.toml\.jinja$

  # Dead relative links in Markdown and HTML. Offline, so a commit never waits on the
  # network: the weekly links.yml checks the web links. lychee's own hook installs its
  # binary with an unpinned install script, so this takes upstream's wheel from PyPI
  # at an exact version instead.
  - repo: local
    hooks:
      - id: lychee
        name: lychee --offline
        entry: lychee --no-progress --offline
        language: python
        additional_dependencies: [lychee-bin==0.24.2]
        types_or: [markdown, html]
        require_serial: true
        # Links to accessibility.md, whose template name is a Jinja condition. The link
        # resolves in the rendered project, where lychee checks it.
        exclude: accessibility-assessment\.md$

  # The Levels table in docs/levels.md is generated: fail when it lags levels.toml.
  - repo: local
    hooks:
      - id: levels-doc
        name: levels table matches levels.toml (just levels-doc)
        entry: python scripts/levels_doc.py --check
        language: python
        files: ^(levels\.toml|docs/levels\.md|CHANGELOG\.md|scripts/levels_doc\.py)$
        pass_filenames: false

  # check_level.py's tests, on small repos it writes to a temp dir.
  - repo: local
    hooks:
      - id: check-level
        name: check_level.py tests
        entry: pytest -q scripts/test_check_level.py
        language: python
        additional_dependencies: [jsonschema==4.26.0, pytest==9.2.0, pyyaml==6.0.3]
        files: ^(levels\.toml|scripts/(check_level|test_check_level)\.py|scripts/check_level\.schema\.json)$
        pass_filenames: false
