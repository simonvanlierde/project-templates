# The documentation site: `just docs` builds docs/ into _docs/; docs.yml deploys it.
# Settings: https://zensical.org/docs/setup/basics/
[project]
site_name = "project-templates"
site_description = "A Copier template that starts Python, TypeScript, Rust, Go and Docker repos, secure by default and kept current by a weekly update PR."
site_url = "https://simonvanlierde.com/project-templates/"
repo_url = "https://github.com/simonvanlierde/project-templates"
repo_name = "simonvanlierde/project-templates"
edit_uri = "edit/main/docs/"
site_dir = "_docs"
extra_css = ["assets/docs.css", "assets/brand.css", "assets/chooser.css"]
extra_javascript = ["assets/docs.js", "assets/chooser.mjs"]
nav = [
  { "Get started" = "index.md" },
  { "Help me choose" = "choose.md" },
  { "Use the template" = "usage.md" },
  { "Set up the repo" = "setup.md" },
  { "Hosting" = "hosting.md" },
  { "Updates" = "updates.md" },
  { "Levels" = "levels.md" },
  { "Python project kinds" = "python-kinds.md" },
  { "Reference" = [
    { "Tools" = "tooling.md" },
    { "CI checks" = "ci-baseline.md" },
    { "Architecture and security" = "design.md" },
    { "Web legal pages" = "web-legal.md" },
  ] },
  { "Roadmap" = "roadmap.md" },
  { "Project" = [
    { "Changelog and upgrade steps" = "https://github.com/simonvanlierde/project-templates/blob/main/CHANGELOG.md" },
    { "Contributing" = "https://github.com/simonvanlierde/project-templates/blob/main/CONTRIBUTING.md" },
    { "Security" = "https://github.com/simonvanlierde/project-templates/blob/main/SECURITY.md" },
    { "Governance" = "https://github.com/simonvanlierde/project-templates/blob/main/GOVERNANCE.md" },
  ] },
  { "Decisions" = [
    { "Decision index" = "decisions/README.md" },
    "decisions/0001-pr-previews-use-the-production-cloudflare-account.md",
    "decisions/0002-wrangler-is-an-exact-dev-dependency.md",
    "decisions/0003-drop-the-ts-docker-image.md",
    "decisions/0004-decision-records-in-rendered-projects.md",
    "decisions/0005-workers-hosting-with-an-optional-script.md",
    "decisions/0006-zensical-builds-the-docs-site.md",
    "decisions/0007-the-plain-site-is-a-tool-page.md",
    "decisions/0008-three-audiences-in-order.md",
    "decisions/0009-optional-features-share-one-extras-answer.md",
    "decisions/0010-a-level-ladder-replaces-the-badge-question.md",
  ] },
]

# docs-overrides/main.html reads these: the announcement names `release`, and `og_image`
# carries the card's hash (`just og-card`), since link previews cache by URL.
[project.extra]
release = "0.14.0"
og_image = "assets/og.png?v=6f68f2a2"
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/simonvanlierde/project-templates"
name = "Source on GitHub"

[[project.extra.social]]
icon = "lucide/quote"
link = "https://doi.org/10.5281/zenodo.23701980"
name = "Cite it: Zenodo DOI"

[[project.extra.social]]
icon = "lucide/globe"
link = "https://simonvanlierde.com/"
name = "Simon van Lierde"

[project.theme]
font = false
custom_dir = "docs-overrides"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.copy",
  "header.autohide",
  "navigation.footer",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# Follows the reader's system setting until they pick one with the header toggle.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

